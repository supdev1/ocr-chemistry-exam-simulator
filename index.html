        ${state.dbMode === 'full' ? '<span style="color:var(--ui-muted);font-size:13px;">A complete paper ignores the topic selection.</span>' : `<label><input type="checkbox" id="includeDrawing" ${state.includeDrawing ? 'checked' : ''}> Include questions that need a drawn answer (you mark these yourself)</label>`}
      </div>` : ''}

      <div class="settings">
        <div class="row" style="justify-content:space-between;">
          <strong style="color:#FFF;">Your account <span style="font-weight:400;color:var(--ui-muted);font-size:13px;">(optional)</span></strong>
          ${state.user ? '<button class="mini-btn" id="signOut">Sign out</button>' : ''}
        </div>
        ${state.user ? `<p class="hint" style="margin-top:6px;">Signed in as <strong style="color:#FFF;">${esc(state.user.email || '')}</strong>. Marks on past-paper questions are saved to your account.</p>` : `
          <p class="hint" style="margin:6px 0 10px;">Sign in to save your marks on past-paper questions. You can practise without an account.</p>
          <div class="row account-row">
            <input type="email" id="authEmail" placeholder="Email" autocomplete="email" value="${esc(state.authEmail)}">
            <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
            <button class="mini-btn" id="signIn" ${state.authBusy ? 'disabled' : ''}>Sign in</button>
            <button class="mini-btn" id="signUp" ${state.authBusy ? 'disabled' : ''}>Create account</button>
          </div>`}
        ${state.authMsg ? `<p class="${state.authMsg.ok ? 'status-ok' : 'status-err'}" style="margin:8px 0 0;">${esc(state.authMsg.msg)}</p>` : ''}
      </div>

      <div class="settings">
        <div class="row" style="justify-content:space-between;">
          <strong style="color:#FFF;">AI settings</strong>
          <button class="mini-btn" id="toggleSettings">${state.settingsOpen ? 'Hide' : (hasKey ? 'Change' : 'Add API key')}</button>
        </div>
        ${state.settingsOpen ? `
          <div class="field" style="margin-top:12px;">
            <label>AI provider</label>
            <div class="provider-row" role="radiogroup">${Object.entries(AI_PROVIDERS).map(([id, pv]) => `<button type="button" class="provider-btn ${id === state.provider ? 'selected' : ''}" data-provider="${id}" role="radio" aria-checked="${id === state.provider}">${esc(pv.label)}${state.keys[id] ? ' <span class="has-key">✓</span>' : ''}</button>`).join('')}</div>
          </div>
          <div class="field">
            <label for="apiKey">${esc(P.label)} API key</label>
            <div class="row"><input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="${esc(P.placeholder)}" value="${esc(state.keys[state.provider] || '')}"><button class="mini-btn" id="testKey">Test key</button>${hasKey ? '<button class="mini-btn" id="clearKey">Remove</button>' : ''}</div>
            <p class="hint">Get a key from <a href="${P.keyUrl}" target="_blank" rel="noopener">${esc(P.keySite)}</a>. It is kept in this browser and sent only to ${esc(P.apiHost)}. Usage is billed to the key’s owner.</p>
            ${state.keyStatus ? `<span class="${state.keyStatus.ok ? 'status-ok' : 'status-err'}">${esc(state.keyStatus.msg)}</span>` : ''}
          </div>
          <div class="field">
            <label for="model">Model</label>
            <select id="model">${P.models.map(m => `<option value="${m.id}" ${!isCustomModel && m.id === curModel ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}<option value="__custom" ${isCustomModel ? 'selected' : ''}>Other model ID…</option></select>
            ${isCustomModel ? `<input type="text" id="customModel" spellcheck="false" placeholder="Exact model ID" value="${esc(P.models.some(m => m.id === curModel) ? '' : curModel)}">` : ''}
          </div>
          <label class="row" style="cursor:pointer;"><input type="checkbox" id="rememberKey" ${state.rememberKey ? 'checked' : ''}> Remember my keys on this device</label>
        ` : `<p class="hint" style="margin-top:6px;">${hasKey ? `${esc(P.label)} · ${esc((P.models.find(m => m.id === curModel) || {}).label || curModel)}. Written answers are marked by ${esc(P.name)}.` : 'Add a key for Claude, ChatGPT or Gemini to write papers and mark answers with AI. Without a key, written answers are marked by keyword matching.'}</p>`}
      </div>

      ${state.configError ? `<div class="config-error">${esc(state.configError)}</div>` : ''}
      ${state.configNote ? `<div class="config-note">${esc(state.configNote)}</div>` : ''}
      <button class="btn" id="startExamBtn" ${sel.size || fullMode ? '' : 'disabled'}>${startLabel}</button>
    `;

    const pick = (el, fn) => { el.onclick = fn; el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }; };
    wrap.querySelectorAll('[data-preset]').forEach(card => pick(card, () => {
      const p = card.getAttribute('data-preset');
      state.preset = p;
      if (p !== 'custom') state.selectedTopics = topicsForModules(PRESET_CONFIGS[p].modules);
      state.configError = null; state.configNote = null;
      render();
    }));
    wrap.querySelectorAll('[data-source]').forEach(card => pick(card, () => {
      const src = card.getAttribute('data-source');
      if (src === 'db' && DB.status === 'error') return;
      state.source = src;
      if (state.source === 'ai' && !hasAI()) state.settingsOpen = true;
      state.configError = null;
      render();
    }));
    const cm = wrap.querySelector('#customMarks'); if (cm) cm.onchange = (e) => { state.customMarks = parseInt(e.target.value, 10); render(); };
    const cq = wrap.querySelector('#customMcq'); if (cq) cq.onchange = (e) => { state.customMcq = e.target.checked; render(); };
    wrap.querySelector('#selAll').onclick = () => { state.selectedTopics = ALL_TOPIC_IDS.slice(); render(); };
    wrap.querySelector('#selNone').onclick = () => { state.selectedTopics = []; render(); };
    wrap.querySelector('#selPaper').onclick = () => { state.selectedTopics = state.preset === 'custom' ? [] : topicsForModules(PRESET_CONFIGS[state.preset].modules); render(); };

    // Modules with expandable topic lists
    const list = wrap.querySelector('#moduleList');
    OCR_MODULES.forEach(m => {
      const ids = m.topics.map(t => t[0]);
      const n = ids.filter(t => sel.has(t)).length;
      const all = n === ids.length, some = n > 0 && !all;
      const open = !!state.expanded[m.id];
      const card = document.createElement('div');
      card.className = `module-card ${all ? 'selected' : some ? 'partial' : ''}`;
      card.innerHTML = `
        <div class="module-head">
          <input type="checkbox" aria-label="${esc(m.name)}" ${all ? 'checked' : ''}>
          <div class="mod-text"><strong>${esc(m.name)}</strong><span class="mod-desc">${esc(m.desc)}</span></div>
          <span class="topic-count">${n}/${ids.length}</span>
          <button class="expand-btn" aria-expanded="${open}">${open ? 'Hide topics' : 'Choose topics'}</button>
        </div>
        ${open ? `<div class="topic-grid">${m.topics.map(([id, name]) => `<label class="topic-chip"><input type="checkbox" data-topic="${id}" ${sel.has(id) ? 'checked' : ''}><span class="tid">${id}</span><span>${fmt(name)}</span>${DB.status === 'ready' ? `<span class="tcount">${DB.countByTopic[id] || 0} Qs</span>` : ''}</label>`).join('')}</div>` : ''}
      `;
      const box = card.querySelector('.module-head input');
      box.indeterminate = some;
      const toggleModule = () => {
        const on = !all;
        state.selectedTopics = on ? [...new Set(state.selectedTopics.concat(ids))] : state.selectedTopics.filter(t => !ids.includes(t));
        render();
      };
      box.onchange = toggleModule;
      card.querySelector('.mod-text').onclick = toggleModule;
      card.querySelector('.expand-btn').onclick = () => { state.expanded[m.id] = !open; render(); };
      card.querySelectorAll('[data-topic]').forEach(cb => {
        cb.onchange = (e) => {
          const t = e.target.getAttribute('data-topic');
          state.selectedTopics = e.target.checked ? [...new Set(state.selectedTopics.concat([t]))] : state.selectedTopics.filter(x => x !== t);
          render();
        };
      });
      list.appendChild(card);
    });

    // API settings
    wrap.querySelector('#toggleSettings').onclick = () => { state.settingsOpen = !state.settingsOpen; state.keyStatus = null; render(); };
    const keyInput = wrap.querySelector('#apiKey');
    const persistKeys = () => { Object.keys(AI_PROVIDERS).forEach(pv => store.set(`ocrchem.key.${pv}`, state.rememberKey && state.keys[pv] ? state.keys[pv] : null)); };
    const setModel = (id) => { state.models[state.provider] = id; store.set(`ocrchem.model.${state.provider}`, id || null); };
    wrap.querySelectorAll('[data-provider]').forEach(b => { b.onclick = () => { state.provider = b.getAttribute('data-provider'); store.set('ocrchem.provider', state.provider); state.keyStatus = null; render(); }; });
    if (keyInput) {
      // Update silently: re-rendering here would swallow a click on "Test key".
      keyInput.oninput = (e) => { state.keys[state.provider] = e.target.value.trim(); state.keyStatus = null; persistKeys(); };
      wrap.querySelector('#model').onchange = (e) => {
        if (e.target.value === '__custom') { state.customModelOpen[state.provider] = true; }
        else { state.customModelOpen[state.provider] = false; setModel(e.target.value); }
        render();
      };
      const cmi = wrap.querySelector('#customModel');
      if (cmi) cmi.oninput = (e) => { setModel(e.target.value.trim() || AI().models[0].id); };
      wrap.querySelector('#rememberKey').onchange = (e) => { state.rememberKey = e.target.checked; persistKeys(); };
      const clr = wrap.querySelector('#clearKey');
      if (clr) clr.onclick = () => { state.keys[state.provider] = ''; state.keyStatus = null; persistKeys(); if (state.source === 'ai') state.source = 'bank'; render(); };
      wrap.querySelector('#testKey').onclick = async (e) => {
        state.keys[state.provider] = keyInput.value.trim(); persistKeys();
        if (!hasAI()) { state.keyStatus = { ok: false, msg: 'Enter a key first.' }; render(); return; }
        e.target.disabled = true; e.target.textContent = 'Testing…';
        try {
          await aiPing(conn());
          state.keyStatus = { ok: true, msg: `Key works with ${conn().model}.` };
          store.set('ocrchem.provider', state.provider);
        } catch (err) { state.keyStatus = { ok: false, msg: err.message }; }
        render();
      };
    }

    wrap.querySelectorAll('input[name="dbMode"]').forEach(r => { r.onchange = () => { state.dbMode = r.value; render(); }; });
    const dbp = wrap.querySelector('#dbPaper'); if (dbp) dbp.onchange = (e) => { state.dbPaperId = parseInt(e.target.value, 10); };
    const incD = wrap.querySelector('#includeDrawing'); if (incD) incD.onchange = (e) => { state.includeDrawing = e.target.checked; render(); };
    const authEmail = wrap.querySelector('#authEmail');
    if (authEmail) authEmail.oninput = (e) => { state.authEmail = e.target.value.trim(); };
    const doAuth = async (mode) => {
      const email = (authEmail.value || '').trim(), password = wrap.querySelector('#authPassword').value;
      state.authEmail = email;
      if (!email || !password) { state.authMsg = { ok: false, msg: 'Enter your email and a password.' }; render(); return; }
      state.authBusy = true; state.authMsg = null; render();
      try {
        const sb = await getSupabase();
        if (mode === 'in') {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          state.authMsg = { ok: true, msg: 'Signed in.' };
        } else {
          const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          state.authMsg = { ok: true, msg: data.session ? 'Account created and signed in.' : 'Account created. Check your email for a confirmation link, then sign in.' };
        }
      } catch (err) { state.authMsg = { ok: false, msg: err.message || 'Sign-in failed.' }; }
      state.authBusy = false; render();
    };
    const si = wrap.querySelector('#signIn'); if (si) si.onclick = () => doAuth('in');
    const su = wrap.querySelector('#signUp'); if (su) su.onclick = () => doAuth('up');
    const so = wrap.querySelector('#signOut'); if (so) so.onclick = async () => { try { const sb = await getSupabase(); await sb.auth.signOut(); } catch (e) { /* ignore */ } state.user = null; state.authMsg = { ok: true, msg: 'Signed out.' }; render(); };

    wrap.querySelector('#startExamBtn').onclick = async () => {
      state.configError = null; state.configNote = null;
      const topics = ALL_TOPIC_IDS.filter(t => sel.has(t));
      if (!topics.length && !fullMode) { state.configError = 'Select at least one topic.'; render(); return; }
      const cfgNow = paperConfig(state);
      let paper;
      if (state.source === 'db') {
        if (DB.status !== 'ready') { state.configError = DB.status === 'error' ? `The question bank could not be reached: ${DB.error}` : 'The question bank is still loading. Try again in a moment.'; render(); return; }
        paper = fullMode ? buildFullPastPaper(state.dbPaperId) : buildPaperFromDb(cfgNow, topics, state.includeDrawing);
        if (!paper.mcqs.length && !paper.structured.length) { state.configError = 'There are no past-paper questions for the selected topics. Choose more topics.'; render(); return; }
        if (!fullMode && paper.total < cfgNow.marks * 0.8) state.configNote = `The question bank has ${paper.available.marks} marks of questions for these topics, so this paper has ${paper.total} of the ${cfgNow.marks} marks requested.`;
        state.busy = { title: 'Loading your paper', sub: 'Fetching question images from the question bank…', steps: [{ label: 'Question images', status: 'running' }] }; render();
        await prepareImages(paper);
        state.busy = null;
      } else if (state.source === 'ai') {
        if (!hasAI()) { state.settingsOpen = true; state.configError = `Add your ${AI().name} API key in AI settings to write a paper with AI, or choose the built-in question bank.`; render(); return; }
        state.busy = { steps: [] }; render();
        try {
          paper = await generateWithAI(cfgNow, topics, conn(), (steps, idx, status, extra) => {
            if (steps) state.busy.steps = steps;
            if (idx != null) state.busy.steps[idx].status = status;
            if (extra) state.busy.steps.push(extra);
            if (status === 'done-extra' || status === 'err-extra') state.busy.steps[state.busy.steps.length - 1].status = status === 'done-extra' ? 'done' : 'err';
            render();
          });
        } catch (err) {
          state.busy = null; state.configError = err.message; render(); return;
        }
        state.busy = null;
      } else {
        paper = buildPaperFromBank(cfgNow, topics);
        if (!paper.mcqs.length && !paper.structured.length) { state.configError = 'The built-in bank has no questions for the selected topics. Choose more topics or write the paper with AI.'; render(); return; }
        if (paper.total < cfgNow.marks * 0.8) state.configNote = `The built-in bank has ${paper.total} marks of questions for these topics (target ${cfgNow.marks}). Write the paper with AI for a full-length paper.`;
      }
      startExam(paper);
    };
    return wrap;
  }

  /* ---------- Page markup shared by layout measuring and rendering ---------- */
  function msHeaderHtml(cfg) {
    return `
      <div class="exam-header">
        <div class="exam-header-left"><h2>Oxford Cambridge and RSA</h2><p><strong>A Level Chemistry A</strong> &mdash; Component ${esc(cfg.code)}</p><p style="font-weight:bold; color:#166534; margin-top:4px;">SECTION 2: MARK SCHEME (CONFIDENTIAL)</p></div>
        <div class="exam-header-right"><div>OFFICIAL MARK SCHEME</div><div style="font-weight:normal; font-size:10pt; margin-top:4px;">Marking Guidelines</div></div>
      </div>
      <div class="section-title">SECTION 2 &mdash; MARK SCHEME (IN ORDER OF SECTION 1)</div>`;
  }
  function msItemHtml(item) {
    const short = item.text.length > 220 ? item.text.slice(0, 217) + '…' : item.text;
    return `
      <div class="mark-scheme-item">
        <div class="mark-scheme-item-top"><span>Question ${esc(item.ref)}</span><span>[${item.marks} ${item.marks === 1 ? 'mark' : 'marks'}]</span></div>
        <div style="font-size:10.5pt; color:#334155; margin-bottom:6px; font-style:italic;">“${esc(short)}”</div>
        <div style="background:#F0FDF4; border:1px solid #16A34A; padding:10px; border-radius:6px; font-family:'Inter', sans-serif; font-size:10pt; color:#166534;"><strong>Mark Scheme:</strong><br>${fmt(item.scheme)}${msImageHtml(item.msImage)}</div>
      </div>`;
  }
  function firstHeaderHtml(paper) {
    const cfg = paper.cfg;
    const modulesCovered = [...new Set(paper.topics.map(moduleOfTopic))].sort();
    const fullPaperTopics = cfg.modules && cfg.modules.length ? topicsForModules(cfg.modules) : [];
    const isSubset = !fullPaperTopics.length || fullPaperTopics.some(t => !paper.topics.includes(t)) || paper.topics.some(t => !fullPaperTopics.includes(t));
    return `
      <div class="exam-header">
        <div class="exam-header-left"><h2>Oxford Cambridge and RSA</h2><p><strong>A Level Chemistry A</strong></p><p>${esc(cfg.title)}</p></div>
        <div class="exam-header-right"><div>COMPONENT ${esc(cfg.code)}</div><div style="font-weight:normal; font-size:10pt; margin-top:4px;">Time allowed: ${esc(cfg.time)}</div><div style="font-weight:bold; font-size:11pt; margin-top:4px;">Total Marks: ${paper.total}</div></div>
      </div>
      <div class="exam-instructions">
        <strong>INSTRUCTIONS TO CANDIDATES</strong>
        <ul>
          <li>Use black ink. You may use an HB pencil for graphs and diagrams.</li>
          <li>Answer <strong>all</strong> the questions${paper.mcqs.length ? ' in Section A (Multiple Choice) and Section B (Structured Questions)' : ''}.</li>
          <li>Questions marked with an asterisk (*) are assessed on the quality of extended response.</li>
          <li>Click <strong>Submit Answer</strong> to check your response against the mark scheme and tally your score. Topics where you lose marks are collected in the <strong>Revision Guide</strong>.</li>
          ${paper.structured.some(q => q.parts.some(pt => pt.selfMark)) ? '<li>Questions marked ✏️ need a drawn answer: draw on paper, then reveal the mark scheme and award your own mark.</li>' : ''}
        </ul>
        <p class="content-covered"><strong>Content covered:</strong> Module${modulesCovered.length > 1 ? 's' : ''} ${modulesCovered.join(', ')}${isSubset ? ` — ${paper.topics.length} selected topic${paper.topics.length > 1 ? 's' : ''}` : ''}. ${paper.source === 'db' ? (paper.pastPaper ? `Complete ${esc(paper.pastPaper)} past paper.` : 'OCR past-paper questions from the question bank.') : paper.source === 'ai' ? `Questions written by ${esc(paper.aiName || 'AI')}.` : 'Offline sample questions.'}${paper.source === 'db' ? (!paper.pastPaper && paper.total < cfg.marks ? ` The bank has ${paper.total} of the ${cfg.marks} marks requested for these topics.` : '') : paper.total < cfg.marks ? (paper.source === 'ai' ? ` ${esc(paper.aiName || 'The AI')} wrote ${paper.total} of the ${cfg.marks} marks requested.` : ` This paper has ${paper.total} of the usual ${cfg.marks} marks because the built-in bank has fewer questions for these topics; write the paper with AI for full length.`) : ''}</p>
      </div>`;
  }
  function contHeaderHtml(cfg, sectionName) {
    return `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #000; padding-bottom:6px; margin-bottom:20px; font-weight:bold;"><span>OCR A-Level Chemistry Component ${esc(cfg.code)}</span><span>${sectionName}</span></div>`;
  }
  function stemOpenHtml(q) {
    return `<div class="question-block"><div class="question-top"><span>Question ${esc(q.ref)} ${topicTag(q.topic)}${sourceTag(q)}</span><span>[Total: ${q.marks} marks]</span></div>${q.stem ? `<div class="question-text">${fmt(q.stem)}</div>` : ''}${renderFigure(q.figure)}`;
  }
  // Group a question's stem and parts into one block on each page.
  function pageItemsHtml(items) {
    let html = '', openQ = null;
    const closeQ = () => { if (openQ) { html += '</div>'; openQ = null; } };
    items.forEach(b => {
      if (b.kind === 'section') { closeQ(); html += `<div class="section-title">${esc(b.title)}</div>`; }
      else if (b.kind === 'mcq') { closeQ(); html += renderMcq(b.q); }
      else if (b.kind === 'stem') { closeQ(); openQ = b.q.id; html += stemOpenHtml(b.q); }
      else if (b.kind === 'part') {
        if (openQ !== b.q.id) { closeQ(); openQ = b.q.id; html += `<div class="question-block"><div class="question-top"><span>Question ${esc(b.q.ref)} (continued)</span><span></span></div>`; }
        html += renderPart(b.q, b.p, b.i);
      }
    });
    closeQ();
    return html;
  }

  // Lay the paper out on A4 pages using real rendered heights.
  function layoutPaper(paper) {
    const sheet = document.createElement('div');
    sheet.className = 'page-sheet';
    sheet.style.cssText = 'position:absolute; left:-10000px; top:0; visibility:hidden; min-height:0;';
    document.body.appendChild(sheet);
    const measure = (html) => {
      sheet.innerHTML = `<div style="display:flow-root">${html}</div>`;
      drawStructures(sheet);
      return sheet.firstChild.getBoundingClientRect().height;
    };
    const pxPerMm = measure('<div style="height:100mm"></div>') / 100;
    const content = (297 - 22 - 25) * pxPerMm - 16; // A4 minus top/bottom padding (footer sits in the bottom margin)
    const cfg = paper.cfg;
    const firstCap = content - measure(firstHeaderHtml(paper));
    const cap = content - measure(contHeaderHtml(cfg, 'Section B Structured Questions'));
    const block = (b) => {
      if (b._h != null) return b._h;
      let html;
      if (b.kind === 'section') html = `<div class="section-title">${esc(b.title)}</div>`;
      else if (b.kind === 'mcq') html = renderMcq(b.q);
      else if (b.kind === 'stem') html = stemOpenHtml(b.q) + '</div>';
      else html = `<div class="question-block" style="margin-bottom:0">${renderPart(b.q, b.p, b.i)}</div>`;
      b._h = measure(html) + (b.kind === 'stem' ? -25 : 0); // stem shares the question block's bottom margin with its parts
      return b._h;
    };
    const msHead = measure(msHeaderHtml(cfg));
    const msItem = (it) => (it._h != null ? it._h : (it._h = measure(msItemHtml(it))));
    const continued = measure(`<div class="question-block" style="margin-bottom:0"><div class="question-top"><span>Question 1 (continued)</span><span></span></div></div>`);
    const result = paginate(paper, { block, firstCap, cap, continued, msItem, msFirstCap: content - msHead, msCap: content - msHead });
    sheet.remove();
    return result;
  }

  function startExam(paper) {
    state.paper = paper;
    state.awardedMarks = {}; state.userAnswers = {}; state.submittedStatus = {}; state.feedback = {}; state.revealedSchemes = {}; state.marking = {};
    state.explanations = {}; state.explainedBy = {}; state.revisionPlanBy = null; state.explaining = {}; state.revCollapsed = {}; state.view = 'paper'; state.revisionPlan = null; state.revisionPlanError = null;
    const { pages, questionPages } = layoutPaper(paper);
    state.pagesData = pages;
    state.questionPages = questionPages;
    state.screen = 'exam';
    state.currentPage = 1;
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- Exam screen ---------- */
  function evalClass(key, max) {
    if (state.marking[key]) return 'pending';
    if (!state.submittedStatus[key]) return '';
    const a = state.awardedMarks[key] || 0;
    return a >= max ? 'correct' : a > 0 ? 'partial' : 'incorrect';
  }
  function evalBox(key, max, topic, item) {
    const cls = evalClass(key, max);
    if (!cls) return '';
    if (cls === 'pending') return `<div class="auto-eval-box pending"><strong>Marking…</strong> ${esc(AI().name)} is marking your answer.</div>`;
    const a = state.awardedMarks[key] != null ? state.awardedMarks[key] : 0;
    return `<div class="auto-eval-box ${cls}"><strong>Auto-Evaluation (${a}/${max}):</strong> ${fmt(state.feedback[key] || '')}</div>${a < max ? revisionBox(key, topic, item) : ''}${savedTag(key)}`;
  }
  function revisionBox(key, topic, item) {
    const t = TOPIC_INDEX[topic];
    const db = item && item.db;
    const plan = db && db.plan;
    const notes = db ? [] : (REVISION_NOTES[topic] || []);
    const expl = state.explanations[key];
    return `<details class="revision-box" data-rev-key="${key}" ${state.revCollapsed[key] ? '' : 'open'}>
      <summary>Revision guide: ${plan ? `${esc(plan.code)} ${fmt(plan.title)}` : `${esc(topic)} ${t ? fmt(t.name) : ''}`}</summary>
      ${db && db.revise_note ? `<p><strong>Key point:</strong> ${fmt(db.revise_note)}</p>` : ''}
      ${plan && plan.revision_guide ? `<p>${fmt(plan.revision_guide)}</p>` : ''}
      ${notes.length ? `<ul>${notes.map(n => `<li>${fmt(n)}</li>`).join('')}</ul>` : ''}
      ${expl ? `<div class="rev-explain"><strong>${esc(state.explainedBy[key] || AI().name)}’s explanation:</strong>${fmtNotes(expl)}</div>` : ''}
      ${hasAI() && !expl ? `<button class="rev-btn" data-explain="${key}" ${state.explaining[key] ? 'disabled' : ''}>${state.explaining[key] ? `${esc(AI().name)} is explaining…` : `Explain my mistake with ${esc(AI().name)}`}</button>` : ''}
      ${!hasAI() ? '<p style="font-size:9pt;color:#4338CA;">Add an AI API key (Claude, ChatGPT or Gemini) in Config for a personal explanation of this mistake.</p>' : ''}
    </details>`;
  }
  // Every answered question that lost marks, grouped by topic.
  function weakTopics() {
    const paper = state.paper, byTopic = {};
    const add = (topic, item, db) => {
      const plan = db && db.plan;
      const gk = plan ? `plan:${plan.id}` : topic;
      const w = byTopic[gk] = byTopic[gk] || (plan ? { topic: plan.code, name: plan.title, guide: plan.revision_guide || '', isDb: true, lost: 0, max: 0, items: [] } : { topic, name: (TOPIC_INDEX[topic] || {}).name || topic, lost: 0, max: 0, items: [] });
      item.note = db ? db.revise_note : '';
      w.lost += item.max - item.awarded; w.max += item.max; w.items.push(item);
    };
    paper.mcqs.forEach(q => { if (state.submittedStatus[q.id] && (state.awardedMarks[q.id] || 0) < 1) add(q.topic, { key: q.id, ref: q.ref, text: q.stem, scheme: q.mark_scheme, answer: state.userAnswers[q.id] || '', awarded: state.awardedMarks[q.id] || 0, max: 1 }, q.db); });
    paper.structured.forEach(q => q.parts.forEach((p, i) => { const k = `${q.id}_p${i}`; if (state.submittedStatus[k] && (state.awardedMarks[k] || 0) < p.marks) add(p.topic, { key: k, ref: `${q.ref}${p.label}`, text: `${q.stem ? q.stem + '\n\n' : ''}${p.text}`, scheme: p.mark_scheme, answer: state.userAnswers[k] || '', awarded: state.awardedMarks[k] || 0, max: p.marks }, p.db); }));
    return Object.values(byTopic).sort((a, b) => b.lost - a.lost || a.topic.localeCompare(b.topic));
  }
  function overrideRow(key, max) {
    const cur = state.awardedMarks[key];
    return `<div class="mark-btn-row"><span>Override mark${max > 1 ? `s (0 to ${max})` : ''}:</span>${Array.from({ length: max + 1 }, (_, m) => `<button class="mark-btn ${cur === m ? 'active' : ''}" data-key="${key}" data-mark="${m}">${m}</button>`).join('')}</div>`;
  }
  const topicTag = (t) => (TOPIC_INDEX[t] ? `<span class="topic-tag">${esc(t)} ${fmt(TOPIC_INDEX[t].name)}</span>` : '');
  const sourceTag = (q) => (q.sourceTag && !(state.paper && state.paper.pastPaper) ? `<span class="source-tag">· ${esc(q.sourceTag)}</span>` : '');
  const msImageHtml = (f) => (f ? `<div class="ms-figure">${figImage(f)}</div>` : '');

  function renderMcq(q) {
    const key = q.id;
    const chosen = state.userAnswers[key] || '';
    const revealed = !!state.revealedSchemes[key];
    return `
      <div class="question-block">
        <div class="question-top"><span>Question ${esc(q.ref)} ${topicTag(q.topic)}${sourceTag(q)}</span><span>[1 mark]</span></div>
        <div class="question-text">${fmt(q.stem)}</div>
        ${renderFigure(q.figure)}
        <div class="${q.options.every(o => !o.text && !o.smiles) ? 'mcq-letters' : 'mcq-grid'}" role="radiogroup" aria-label="Your answer">
          ${q.options.map(o => `<button type="button" class="mcq-option ${chosen === o.letter ? 'chosen' : ''}" data-mcq="${key}" data-letter="${esc(o.letter)}" role="radio" aria-checked="${chosen === o.letter}"><span class="letter">${esc(o.letter)}</span><span>${o.smiles ? `<span class="opt-structure">${smilesSlot(o.smiles, true)}</span>` : ''}${fmt(o.text)}</span></button>`).join('')}
        </div>
        <div class="q-actions">
          <button class="submit-answer-btn" data-submit-key="${key}">Submit Answer &amp; Auto-Mark</button>
          <button class="reveal-btn" data-reveal="${key}">${revealed ? 'Hide Mark Scheme' : 'Reveal Mark Scheme'}</button>
        </div>
        ${evalBox(key, 1, q.topic, q)}
        <div class="mark-scheme-drawer ${revealed ? 'visible' : ''}">
          <strong>Answer &amp; Mark Scheme:</strong>
          <p style="margin:4px 0 6px 0;color:#166534;">${fmt(q.mark_scheme)}</p>
          ${msImageHtml(q.msImage)}
          ${overrideRow(key, 1)}
        </div>
      </div>`;
  }
  function renderPart(q, p, i) {
    const key = `${q.id}_p${i}`;
    const revealed = !!state.revealedSchemes[key];
    const rows = Math.min(10, 2 + Math.ceil(p.marks * 1.5));
    return `
      <div class="subquestion-block">
        <div class="subquestion-top"><span>${esc(q.ref)}${esc(p.label)}</span><span>[${p.marks} ${p.marks === 1 ? 'mark' : 'marks'}]</span></div>
        <div class="question-text">${fmt(p.text)}</div>
        ${renderFigure(p.figure)}
        ${p.selfMark ? `<div class="self-mark-note">✏️ This question needs a drawn answer. Draw it on paper, then reveal the mark scheme and give yourself a mark.</div>` : `<div class="answer-space"><textarea rows="${rows}" data-answer-key="${key}" placeholder="Write your full working and final response here...">${esc(state.userAnswers[key] || '')}</textarea></div>`}
        <div class="q-actions">
          ${p.selfMark ? '<span></span>' : `<button class="submit-answer-btn" data-submit-key="${key}" ${state.marking[key] ? 'disabled' : ''}>${state.marking[key] ? 'Marking…' : 'Submit Answer &amp; Auto-Mark'}</button>`}
          <button class="reveal-btn" data-reveal="${key}">${revealed ? 'Hide Mark Scheme' : 'Reveal Mark Scheme'}</button>
        </div>
        ${evalBox(key, p.marks, p.topic, p)}
        <div class="mark-scheme-drawer ${revealed ? 'visible' : ''}">
          <strong>Mark Scheme:</strong>
          <p style="margin:4px 0 6px 0;color:#166534;">${fmt(p.mark_scheme)}</p>
          ${msImageHtml(p.msImage)}
          ${p.selfMark ? `<div class="mark-btn-row" style="margin-top:6px;"><strong>Your mark:</strong></div>` : ''}${overrideRow(key, p.marks)}
        </div>
      </div>`;
  }

  function renderRevisionSheet(weak, cfg) {
    const sheet = document.createElement('div');
    sheet.className = 'page-sheet';
    const answered = Object.keys(state.submittedStatus).length;
    const lostTotal = weak.reduce((a, w) => a + w.lost, 0);
    let html = `
      <div class="exam-header">
        <div class="exam-header-left"><h2>Revision Guide</h2><p><strong>A Level Chemistry A</strong> &mdash; ${esc(cfg.title)}</p><p style="margin-top:4px;">Based on ${answered} answered question${answered === 1 ? '' : 's'}</p></div>
        <div class="exam-header-right"><div>${weak.length} topic${weak.length === 1 ? '' : 's'} to review</div><div style="font-weight:normal; font-size:10pt; margin-top:4px;">${lostTotal} mark${lostTotal === 1 ? '' : 's'} lost</div></div>
      </div>`;
    if (!weak.length) {
      html += `<div class="rev-empty">${answered ? 'No marks lost so far — well done. Keep answering questions and any topic where you drop marks will appear here with revision notes.' : 'Submit answers on the paper. Any topic where you lose marks will appear here with revision notes, ordered by the marks you dropped.'}</div>`;
    } else {
      if (hasAI()) {
        html += state.revisionPlan
          ? `<div class="rev-plan"><strong>Your personalised revision plan (${esc(state.revisionPlanBy || AI().name)})</strong>${fmtNotes(state.revisionPlan)}</div>`
          : `<button class="rev-btn" id="revisionPlanBtn" ${state.revisionPlanBusy ? 'disabled' : ''} style="margin-bottom:14px;">${state.revisionPlanBusy ? `${esc(AI().name)} is writing your revision plan…` : `Write a personalised revision plan with ${esc(AI().name)}`}</button>${state.revisionPlanError ? `<p style="color:#B91C1C;font-family:Inter,sans-serif;font-size:10pt;">${esc(state.revisionPlanError)}</p>` : ''}`;
      }
      html += `<div class="section-title">Topics to review (most marks lost first)</div>`;
      weak.forEach(w => {
        const notes = w.isDb ? [] : (REVISION_NOTES[w.topic] || []);
        const keyPoints = [...new Set(w.items.map(it => it.note).filter(Boolean))];
        html += `<div class="rev-topic">
          <div class="rev-topic-top"><span>${esc(w.topic)} ${fmt(w.name)}</span><span>${w.lost} / ${w.max} marks lost</span></div>
          <div class="rev-missed">Module ${moduleOfTopic(w.topic)} · Questions: ${w.items.map(it => `<a href="#" data-goto-key="${it.key}">${esc(it.ref)}</a> (${it.awarded}/${it.max})`).join(', ')}</div>
          ${w.guide ? `<p style="font-size:11pt;margin:6px 0;">${fmt(w.guide)}</p>` : ''}
          ${keyPoints.length ? `<div class="rev-missed" style="margin-top:4px;">Key points from the questions you dropped marks on:</div><ul>${keyPoints.map(n => `<li>${fmt(n)}</li>`).join('')}</ul>` : ''}
          ${notes.length ? `<ul>${notes.map(n => `<li>${fmt(n)}</li>`).join('')}</ul>` : ''}
          ${w.items.filter(it => state.explanations[it.key]).map(it => `<div class="rev-explain" style="font-family:Inter,sans-serif;font-size:10pt;"><strong>Question ${esc(it.ref)} — ${esc(state.explainedBy[it.key] || AI().name)}’s explanation:</strong>${fmtNotes(state.explanations[it.key])}</div>`).join('')}
        </div>`;
      });
    }
    html += `<div class="page-footer"><span>OCR 2026 [${esc(cfg.code)}]</span><span>Revision Guide</span><span>Print with the paper</span></div>`;
    sheet.innerHTML = html;
    return sheet;
  }

  function renderExamPaper() {
    const paper = state.paper;
    const cfg = paper.cfg;
    const totalPages = state.pagesData.length;
    const viewport = document.createElement('div');
    const weak = weakTopics();

    const toolbar = document.createElement('div');
    toolbar.className = 'exam-toolbar';
    const opts = state.pagesData.map(p => `<option value="${p.pageNum}" ${p.pageNum === state.currentPage ? 'selected' : ''}>${p.isMarkSchemePage ? `Section 2: Mark Scheme (p.${p.pageNum})` : `Page ${p.pageNum} of ${totalPages}`}</option>`).join('');
    toolbar.innerHTML = `
      <div><strong>OCR A-Level Chemistry</strong> &mdash; ${esc(cfg.title)} (${esc(cfg.code)})</div>
      <div class="nav-btn-group">
        <button id="prevPageBtn" ${state.currentPage === 1 ? 'disabled' : ''}>&larr; Prev Page</button>
        <select id="pageSelect" aria-label="Go to page">${opts}</select>
        <button id="nextPageBtn" ${state.currentPage === totalPages ? 'disabled' : ''}>Next Page &rarr;</button>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="revisionBtn" style="${state.view === 'revision' ? 'background:#4F46E5;' : ''}">${state.view === 'revision' ? 'Back to Paper' : `Revision Guide${weak.length ? ` (${weak.length})` : ''}`}</button>
        <button id="toggleModeBtn">${state.showSinglePageMode ? 'Show All Pages' : 'Single Page Mode'}</button>
        <button id="printBtn">Print / Save PDF</button>
        <button id="backBtn">Config</button>
      </div>`;
    viewport.appendChild(toolbar);

    const sheetContainer = document.createElement('div');
    sheetContainer.className = 'exam-sheet-container';

    state.pagesData.forEach(pData => {
      const pageNum = pData.pageNum;
      const sheet = document.createElement('div');
      sheet.className = `page-sheet ${state.view === 'revision' || (state.showSinglePageMode && state.currentPage !== pageNum) ? 'hidden' : ''}`;
      let html = '';
      if (pData.isMarkSchemePage) {
        html += msHeaderHtml(cfg) + pData.msChunk.map(msItemHtml).join('');
      } else {
        if (pageNum === 1) html += firstHeaderHtml(paper);
        else {
          const firstB = pData.items.find(b => b.kind !== 'section');
          html += contHeaderHtml(cfg, firstB && firstB.kind === 'mcq' ? 'Section A Continued' : (paper.mcqs.length ? 'Section B Structured Questions' : 'Structured Questions'));
        }
        html += pageItemsHtml(pData.items);
      }
      html += `<div class="page-footer"><span>OCR 2026 [${esc(cfg.code)}]</span><span>Page ${pageNum} of ${totalPages}</span><span>${pData.isMarkSchemePage ? 'End of Mark Scheme' : (pageNum === state.questionPages ? 'END OF QUESTION PAPER' : 'Turn over')}</span></div>`;
      sheet.innerHTML = html;
      sheetContainer.appendChild(sheet);
    });
    if (state.view === 'revision') sheetContainer.appendChild(renderRevisionSheet(weak, cfg));
    viewport.appendChild(sheetContainer);

    const totalAwarded = Object.values(state.awardedMarks).reduce((a, b) => a + (typeof b === 'number' ? b : 0), 0);
    const tallyBar = document.createElement('div');
    tallyBar.className = 'score-summary-bar';
    tallyBar.innerHTML = `
      <div><strong>Live Score Tally:</strong> <span style="color:#38BDF8; font-size:16px; font-weight:bold;">${totalAwarded}</span> / ${paper.total} Marks | Component ${esc(cfg.code)}${paper.source === 'db' ? (state.user ? ' · <span style="color:#34D399;">Marks saved to your account</span>' : ' · <span style="color:#94A3B8;">Not signed in — marks aren’t saved</span>') : ''}</div>
      <div style="display:flex; gap:12px;">
        <button id="bottomPrev" class="btn-ghost" ${state.currentPage === 1 ? 'disabled' : ''}>&larr; Prev Page</button>
        <span style="align-self:center;">Page ${state.currentPage} of ${totalPages}</span>
        <button id="bottomNext" class="btn-ghost" ${state.currentPage === totalPages ? 'disabled' : ''}>Next Page &rarr;</button>
      </div>`;
    viewport.appendChild(tallyBar);

    // ---- events
    viewport.querySelectorAll('details[data-rev-key]').forEach(d => { d.ontoggle = () => { state.revCollapsed[d.getAttribute('data-rev-key')] = !d.open; }; });
    toolbar.querySelector('#revisionBtn').onclick = () => { state.view = state.view === 'revision' ? 'paper' : 'revision'; render(); window.scrollTo(0, 0); };
    viewport.querySelectorAll('[data-explain]').forEach(btn => {
      btn.onclick = async () => {
        const key = btn.getAttribute('data-explain');
        let ctx;
        if (key.startsWith('mcq_')) {
          const q = paper.mcqs.find(x => x.id === key);
          ctx = { topic: q.topic, topicName: (TOPIC_INDEX[q.topic] || {}).name, stem: q.db && q.db.revise_note ? `(Revision note: ${q.db.revise_note})` : '', text: q.stem, options: q.options.map(o => `${o.letter}: ${plain(o.text)}${o.smiles ? ` (${o.smiles})` : ''}`).join(' | '), scheme: q.mark_scheme, answer: state.userAnswers[key] ? `option ${state.userAnswers[key]}` : '', awarded: state.awardedMarks[key] || 0, max: 1 };
        } else {
          const f = findPart(key); if (!f) return;
          ctx = { topic: f.p.topic, topicName: (TOPIC_INDEX[f.p.topic] || {}).name, stem: f.q.stem, text: f.p.text, scheme: f.p.mark_scheme, answer: state.userAnswers[key] || '', awarded: state.awardedMarks[key] || 0, max: f.p.marks };
        }
        state.explaining[key] = true; render();
        try { state.explanations[key] = await explainWithAI(conn(), ctx); state.explainedBy[key] = AI().name; }
        catch (err) { state.explanations[key] = `Could not get an explanation: ${err.message}`; }
        delete state.explaining[key]; render();
      };
    });
    const planBtn = viewport.querySelector('#revisionPlanBtn');
    if (planBtn) planBtn.onclick = async () => {
      state.revisionPlanBusy = true; state.revisionPlanError = null; render();
      try { state.revisionPlan = await revisionPlanWithAI(conn(), weak); state.revisionPlanBy = AI().name; }
      catch (err) { state.revisionPlanError = err.message; }
      state.revisionPlanBusy = false; render();
    };
    viewport.querySelectorAll('[data-goto-key]').forEach(a => {
      a.onclick = (e) => {
        e.preventDefault();
        const key = a.getAttribute('data-goto-key');
        const pg = state.pagesData.find(p => !p.isMarkSchemePage && p.items.some(b => (b.kind === 'mcq' && b.q.id === key) || (b.kind === 'part' && `${b.q.id}_p${b.i}` === key)));
        state.view = 'paper';
        if (pg) state.currentPage = pg.pageNum;
        render();
        const el = document.querySelector(`[data-submit-key="${key}"]`);
        if (el) el.scrollIntoView({ block: 'center' });
      };
    });
    const findPart = (key) => {
      const m = key.match(/^(sq_\d+)_p(\d+)$/);
      if (!m) return null;
      const q = paper.structured.find(x => x.id === m[1]);
      return q ? { q, p: q.parts[+m[2]] } : null;
    };
    viewport.querySelectorAll('textarea[data-answer-key]').forEach(ta => { ta.oninput = (e) => { state.userAnswers[e.target.getAttribute('data-answer-key')] = e.target.value; }; });
    viewport.querySelectorAll('[data-mcq]').forEach(btn => { btn.onclick = () => { state.userAnswers[btn.getAttribute('data-mcq')] = btn.getAttribute('data-letter'); render(); }; });
    viewport.querySelectorAll('.submit-answer-btn').forEach(btn => {
      btn.onclick = async () => {
        const key = btn.getAttribute('data-submit-key');
        const ans = state.userAnswers[key] || '';
        if (key.startsWith('mcq_')) {
          const q = paper.mcqs.find(x => x.id === key);
          if (!ans) { state.awardedMarks[key] = 0; state.feedback[key] = 'No option selected.'; }
          else if (ans === q.answer) { state.awardedMarks[key] = 1; state.feedback[key] = `Correct — option ${q.answer}.`; }
          else { state.awardedMarks[key] = 0; state.feedback[key] = `Incorrect. The answer is ${q.answer}.`; }
          state.submittedStatus[key] = true; render(); saveAttempt(key); return;
        }
        const found = findPart(key); if (!found) return;
        const { q, p } = found;
        if (!ans.trim()) { state.awardedMarks[key] = 0; state.feedback[key] = 'No answer provided.'; state.submittedStatus[key] = true; render(); saveAttempt(key); return; }
        if (hasAI()) {
          state.marking[key] = true; render();
          try {
            const r = await markWithAI(conn(), { stem: q.stem, ref: `${q.ref}${p.label}`, text: p.text, scheme: p.mark_scheme, max: p.marks, answer: ans });
            state.awardedMarks[key] = r.awarded; state.feedback[key] = r.feedback;
          } catch (err) {
            const r = keywordMark(ans, p.mark_scheme, p.marks);
            state.awardedMarks[key] = r.awarded; state.feedback[key] = `${AI().name} marking failed (${err.message}). ${r.feedback}`;
          }
          delete state.marking[key];
        } else {
          const r = keywordMark(ans, p.mark_scheme, p.marks);
          state.awardedMarks[key] = r.awarded; state.feedback[key] = r.feedback;
        }
        state.submittedStatus[key] = true; render(); saveAttempt(key);
      };
    });
    const go = (n) => { state.currentPage = Math.min(totalPages, Math.max(1, n)); render(); window.scrollTo(0, 0); };
    toolbar.querySelector('#prevPageBtn').onclick = () => go(state.currentPage - 1);
    toolbar.querySelector('#nextPageBtn').onclick = () => go(state.currentPage + 1);
    toolbar.querySelector('#pageSelect').onchange = (e) => go(parseInt(e.target.value, 10));
    tallyBar.querySelector('#bottomPrev').onclick = () => go(state.currentPage - 1);
    tallyBar.querySelector('#bottomNext').onclick = () => go(state.currentPage + 1);
    toolbar.querySelector('#toggleModeBtn').onclick = () => { state.showSinglePageMode = !state.showSinglePageMode; render(); };
    toolbar.querySelector('#backBtn').onclick = () => { state.screen = 'config'; render(); window.scrollTo(0, 0); };
    toolbar.querySelector('#printBtn').onclick = () => {
      const was = state.showSinglePageMode;
      state.showSinglePageMode = false; render();
      setTimeout(() => { window.print(); state.showSinglePageMode = was; render(); }, 150);
    };
    viewport.querySelectorAll('[data-reveal]').forEach(btn => { btn.onclick = () => { const k = btn.getAttribute('data-reveal'); state.revealedSchemes[k] = !state.revealedSchemes[k]; render(); }; });
    viewport.querySelectorAll('.mark-btn').forEach(btn => { btn.onclick = () => { const k = btn.getAttribute('data-key'); state.awardedMarks[k] = parseInt(btn.getAttribute('data-mark'), 10); state.submittedStatus[k] = true; state.feedback[k] = !state.feedback[k] || /^Mark set manually\.$/.test(state.feedback[k]) ? 'Mark set manually.' : state.feedback[k].replace(/ \(Mark overridden\.\)$/, '') + ' (Mark overridden.)'; render(); saveAttempt(k); }; });
    return viewport;
  }

  render();

  // Load the Supabase question bank and any saved sign-in.
  (async () => {
    try {
      const before = new Set(state.selectedTopics);
      const known = OCR_MODULES.map(m => m.topics.map(t => t[0]));
      await loadBank();
      // Keep "whole module selected" selections whole now the topic list comes from the database.
      OCR_MODULES.forEach((m, i) => {
        if (known[i].length && known[i].every(t => before.has(t))) state.selectedTopics = [...new Set(state.selectedTopics.concat(m.topics.map(t => t[0])))];
      });
      state.selectedTopics = state.selectedTopics.filter(t => TOPIC_INDEX[t]);
    } catch (e) {
      DB.status = 'error';
      DB.error = /fetch|network|load failed|timed out/i.test(e.message || '') ? 'Could not connect to the question bank, so the offline sample questions are selected instead.' : (e.message || String(e));
      if (state.source === 'db') state.source = 'bank';
    }
    if (state.screen === 'config') render();
    try {
      const sb = await getSupabase();
      const { data } = await sb.auth.getSession();
      state.user = data && data.session ? data.session.user : null;
      sb.auth.onAuthStateChange((_evt, session) => { state.user = session ? session.user : null; render(); });
      render();
    } catch (e) { /* accounts unavailable */ }
  })();
});
</script>
</body>
</html>
