<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chemistry Revision - OCR A-Level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #0F172A;
    --panel: #1E293B;
    --ink: #F8FAFC;
    --ink-2: #94A3B8;
    --rule: #334155;
    --action: #0EA5E9;
    --action-ink: #0F172A;
    --focus: #38BDF8;
    --ph-yellow: #EAB308;
    --good: #10B981;
    --bad: #F87171;
    --display: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
    --body: 'Atkinson Hyperlegible', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--body); }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.2; margin: 0; }
  p { margin: 0 0 12px; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .center { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
  .muted { color: var(--ink-2); }
  .small { font-size: 14px; }
  .error-box { padding: 16px; border-radius: 10px; border: 1px solid var(--bad); background: rgba(248,113,113,.1); color: #FECACA; margin-bottom: 20px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border: 2px solid var(--action); background: var(--action); color: var(--action-ink); font-weight: 700; border-radius: 8px; cursor: pointer; text-decoration: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn--ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn--text { border: 0; background: none; color: var(--action); text-decoration: underline; padding: 0; cursor: pointer; font-weight: 700; min-height: 0; }

  .field { display: block; margin-bottom: 18px; }
  .field > span { display: block; font-weight: 700; margin-bottom: 6px; }
  .field textarea { width: 100%; min-height: 140px; padding: 12px; background: var(--panel); border: 2px solid var(--rule); border-radius: 8px; color: var(--ink); }

  .module-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 20px 0 28px; }
  @media (min-width: 480px) { .module-grid { grid-template-columns: 1fr 1fr; } }

  .module-card { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 10px; border: 2px solid var(--rule); background: var(--panel); cursor: pointer; }
  .module-card.selected { border-color: var(--action); background: rgba(14, 165, 233, 0.12); }
  .module-card.empty { opacity: .5; cursor: not-allowed; }
  .module-card input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--action); cursor: pointer; }
  .module-card-info strong { display: block; font-size: 15px; color: var(--ink); }
  .module-card-info span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }

  .center--wide { max-width: 760px; }
  .module-list { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 28px; }
  .module-block { border: 2px solid var(--rule); border-radius: 10px; background: var(--panel); }
  .module-block.selected { border-color: var(--action); }
  .module-block.empty { opacity: .55; }
  .module-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .module-head > input[type="checkbox"], .topic-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--action); flex-shrink: 0; cursor: pointer; }
  .module-title { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .module-title strong { font-size: 15px; }
  .module-actions { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .module-actions .btn--text:disabled { opacity: .4; text-decoration: none; cursor: default; }
  .chev { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 16px; }
  .topic-list { border-top: 1px solid var(--rule); padding: 6px 14px 12px; }
  .topic-section { margin: 12px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .topic-row { display: grid; grid-template-columns: 20px 52px 1fr auto; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 6px; cursor: pointer; }
  .topic-row:hover { background: rgba(14,165,233,.08); }
  .topic-row.empty { opacity: .5; cursor: not-allowed; }
  .topic-code { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .topic-title { font-size: 15px; }
  .topic-count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
  @media (max-width: 520px) { .module-head { flex-wrap: wrap; } .module-actions { width: 100%; justify-content: flex-end; } .topic-row { grid-template-columns: 20px 44px 1fr auto; } }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .pill { position: relative; }
  .pill input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .pill span { display: inline-block; padding: 8px 16px; border: 2px solid var(--rule); border-radius: 8px; background: var(--panel); font-size: 14px; font-weight: 700; cursor: pointer; }
  .pill input:checked + span { background: var(--action); color: var(--action-ink); border-color: var(--action); }

  .quiz-container { display: flex; flex-direction: column; min-height: 100vh; background: var(--paper); }
  @media (min-width: 900px) { .quiz-container { height: 100vh; overflow: hidden; } }
  .quiz-header { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); flex-shrink: 0; }
  .quiz-body { display: grid; grid-template-columns: 1fr; flex: 1; }
  @media (min-width: 900px) { .quiz-body { grid-template-columns: 1fr 1fr; overflow: hidden; } }

  .pane-left { padding: 24px 16px; overflow-y: auto; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 20px; }
  .pane-right { padding: 24px 16px; background: rgba(30, 41, 59, 0.4); overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }

  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; background: rgba(14, 165, 233, 0.15); color: var(--action); border: 1px solid rgba(14, 165, 233, 0.3); }
  .badge-marks { background: rgba(234, 179, 8, 0.15); color: var(--ph-yellow); border-color: rgba(234, 179, 8, 0.3); }

  .q-img { max-width: 100%; border-radius: 8px; background: #fff; cursor: zoom-in; display: block; }
  .img-note { font-size: 13px; color: var(--ink-2); border: 1px dashed var(--rule); border-radius: 8px; padding: 10px 12px; }

  .option-card { width: 100%; display: flex; align-items: center; padding: 16px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--panel); color: var(--ink); text-align: left; cursor: pointer; min-height: 54px; margin-bottom: 10px; }
  .option-card.selected { border-color: var(--action); background: rgba(14, 165, 233, 0.15); font-weight: 700; }
  .option-card.correct { border-color: var(--good); background: rgba(16, 185, 129, 0.15); }
  .option-card.wrong { border-color: var(--bad); background: rgba(248, 113, 113, 0.12); }
  .option-key { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--rule); font-weight: 700; margin-right: 12px; flex-shrink: 0; }
  .option-card.selected .option-key { background: var(--action); color: var(--action-ink); }
  .option-card.correct .option-key { background: var(--good); color: var(--action-ink); }

  .mark-scheme-box { padding: 20px; border-radius: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #A7F3D0; }
  .mark-btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .mark-btn { min-width: 48px; min-height: 48px; border-radius: 8px; border: 2px solid var(--rule); background: var(--panel); font-weight: 700; cursor: pointer; }
  .mark-btn[aria-pressed="true"] { background: var(--action); color: var(--action-ink); border-color: var(--action); }

  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 10px; font-weight: 700; }
  .feedback--good { background: rgba(16,185,129,.15); border: 1px solid var(--good); color: #A7F3D0; }
  .feedback--bad { background: rgba(248,113,113,.12); border: 1px solid var(--bad); color: #FECACA; }
  .feedback--info { background: rgba(14,165,233,.12); border: 1px solid rgba(14,165,233,.4); color: var(--ink); font-weight: 400; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 16px; }
  .option-card:disabled { cursor: default; }
  .revise-box { margin-top: 16px; padding: 16px 18px; border-radius: 12px; background: rgba(234,179,8,.10); border: 1px solid rgba(234,179,8,.45); }
  .revise-head { display: block; color: var(--ph-yellow); margin-bottom: 6px; }
  .revise-note { margin: 0 0 10px; }
  .revise-topic { border-top: 1px solid rgba(234,179,8,.3); padding-top: 10px; font-size: 14px; color: var(--ink-2); }
  .revise-topic p { margin: 4px 0 0; }
  .revise-topic-name { font-weight: 700; color: var(--ink); }
  .revision-list { text-align: left; margin-top: 28px; }
  .revision-list h2 { font-size: 20px; margin-bottom: 4px; }
  .revision-topic { margin-top: 18px; padding: 14px 16px; border-radius: 10px; border: 1px solid rgba(234,179,8,.45); background: rgba(234,179,8,.06); }
  .revision-topic h3 { font-size: 16px; margin-bottom: 6px; color: var(--ph-yellow); }
  .revision-topic p { font-size: 14px; }
  .revision-topic ul { margin: 6px 0 0; padding-left: 18px; }
  .revision-topic li { margin: 6px 0; font-size: 15px; }
  .revision-ref { display: block; font-size: 13px; color: var(--ink-2); font-weight: 700; }
  .rich-text .rt-text { white-space: pre-wrap; }
  .ms-text { margin-top: 8px; }
  .rt-table-wrap { overflow-x: auto; margin: 10px 0 14px; }
  .rt-table { border-collapse: collapse; font-size: 15px; min-width: 60%; }
  .rt-table th, .rt-table td { border: 1px solid var(--rule); padding: 8px 12px; text-align: left; vertical-align: top; }
  .rt-table th { background: rgba(148,163,184,.12); font-weight: 700; }
  .rt-table td { font-variant-numeric: tabular-nums; }
  .mark-scheme-box .rt-table th, .mark-scheme-box .rt-table td { border-color: rgba(16,185,129,.35); }
  .summary-container { max-width: 600px; margin: 40px auto; padding: 32px; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; text-align: center; }
  .score-circle { font-size: 48px; font-family: var(--display); color: var(--action); margin: 20px 0; }
  .breakdown { text-align: left; margin-top: 20px; border-top: 1px solid var(--rule); }
  .breakdown div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }

  dialog { border: 0; padding: 0; background: transparent; max-width: 95vw; max-height: 95vh; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); }
  dialog img { max-width: 90vw; max-height: 85vh; border-radius: 8px; display: block; margin: 0 auto; background: #fff; }
</style>
</head>
<body>
<div id="app"><div style="padding:40px; text-align:center; font-family:sans-serif;">Loading Chemistry Quiz...</div></div>
<dialog id="zoom"><img alt=""><button class="btn" type="button" style="display:flex; margin: 12px auto 0;">Close</button></dialog>

<script>
// ---- Supabase "Chemistry Revision" project (read-only, publishable key) ----
const SUPABASE_URL = 'https://xnwdrahlkndisnxsfdji.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VUUf9uid8qaf8wjofoJJDA_15au4EfE';
const IMAGE_BUCKET = 'question-images';
const QUESTION_COLUMNS = 'id, paper_id, year, module_id, question_ref, marks, question_text, mark_scheme, image_path, mark_scheme_image_path, question_type, revise_note';

// Names match the `modules` table in Supabase (module numbers 1–6).
const OCR_MODULES = [
  { id: 1, name: 'Module 1: Development of practical skills in chemistry' },
  { id: 2, name: 'Module 2: Foundations in chemistry' },
  { id: 3, name: 'Module 3: Periodic table and energy' },
  { id: 4, name: 'Module 4: Core organic chemistry' },
  { id: 5, name: 'Module 5: Physical chemistry and transition elements' },
  { id: 6, name: 'Module 6: Organic chemistry and analysis' }
];

window.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const $ = (sel) => document.querySelector(sel);
  const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  const S = {
    screen: null, sess: null,
    loading: true, starting: false, error: null,
    topics: [],            // plan topics: { id, code, module, title, section, sort }
    topicQ: {},            // topicId -> [question ids] (online questions whose PRIMARY plan topic is this one)
    qTopic: {}, topicById: {},
    selected: new Set(),   // selected topic ids
    expanded: new Set(),   // module numbers whose topic list is open
    questionCount: 10
  };

  const STORE_KEY = 'ocrquiz.selectedTopics.v1';
  function saveSelection() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...S.selected])); } catch (_) {} }
  function loadSelection() { try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); return Array.isArray(v) ? v : null; } catch (_) { return null; } }

  // ---- MCQ parsing: options are the trailing lines "A  text" … "D  text" ----
  function parseMCQ(text) {
    const lines = String(text || '').replace(/\s+$/, '').split('\n');
    const options = [];
    let i = lines.length - 1;
    // Image descriptions like "(Structures in the image: …)" may follow the options; keep them with the prompt
    const trailer = [];
    while (i >= 0 && (lines[i].trim() === '' || /^\(.*\)$/.test(lines[i].trim()))) trailer.unshift(lines[i--]);
    while (i >= 0) {
      const m = lines[i].trim().match(/^([A-D])(?:\)|\.|:)?\s+(.+)$/);
      if (!m) { if (lines[i].trim() === '' && options.length === 0) { i--; continue; } break; }
      options.unshift({ key: m[1], text: m[2].replace(/^\|\s*/, '').trim() });
      i--;
    }
    const keys = options.map(o => o.key).join('');
    if (options.length >= 2 && 'ABCD'.startsWith(keys)) {
      return { prompt: [...lines.slice(0, i + 1), ...trailer].join('\n').trim(), options };
    }
    return parseInlineMCQ(text);
  }

  // Options written on one line: "… ? A Silver chloride, B Silver nitrate, C …, D …"
  function parseInlineMCQ(text) {
    const t = String(text || '').trim();
    const m = t.match(/^([\s\S]*?[?.:)])\s+A\s+(.+?),\s+B\s+(.+?),\s+C\s+(.+?),\s+D\s+(.+)$/);
    if (!m) return null;
    return { prompt: m[1].trim(), options: ['A', 'B', 'C', 'D'].map((k, j) => ({ key: k, text: m[j + 2].trim() })) };
  }

  // MCQs whose options are only in the diagram: plain A–D buttons
  function letterOnlyMCQ(text) {
    return {
      prompt: String(text || '').replace(/[\s.]*A,\s*B,\s*C,\s*D\s*$/, '').trim(),
      options: ['A', 'B', 'C', 'D'].map(k => ({ key: k, text: 'Option ' + k + ' (see diagram)' }))
    };
  }

  function correctLetter(ms) {
    const m = String(ms || '').trim().match(/^([A-D])\b/);
    return m ? m[1] : null;
  }

  // ---- Data loading ----
  async function fetchPaged(build) {
    const rows = []; const page = 1000;
    for (let from = 0; ; from += page) {
      const { data, error } = await build().range(from, from + page - 1);
      if (error) throw error;
      rows.push(...data);
      if (data.length < page) break;
    }
    return rows;
  }

  async function loadBank() {
    S.loading = true; S.error = null; render();
    try {
      if (!db) throw new Error('Could not load the Supabase library.');
      const [topics, links] = await Promise.all([
        fetchPaged(() => db.from('topics').select('id, code, module_number, title, sort_order, section_title, revision_guide')
          .eq('scheme', 'plan').order('sort_order')),
        fetchPaged(() => db.from('question_topics').select('topic_id, question_id, questions!inner(delivery_mode)')
          .eq('scheme', 'plan').eq('is_primary', true).eq('questions.delivery_mode', 'online').order('question_id'))
      ]);
      S.topics = topics.map(t => ({ id: t.id, code: t.code, module: t.module_number, title: t.title, section: t.section_title, sort: t.sort_order, guide: t.revision_guide }));
      S.topicById = Object.fromEntries(S.topics.map(t => [t.id, t]));
      S.topicQ = {};
      S.qTopic = {};
      links.forEach(l => { (S.topicQ[l.topic_id] = S.topicQ[l.topic_id] || []).push(l.question_id); S.qTopic[l.question_id] = l.topic_id; });
      const usable = S.topics.filter(t => S.topicQ[t.id]).map(t => t.id);
      const saved = loadSelection();
      S.selected = new Set(saved ? saved.filter(id => usable.includes(id)) : usable);
    } catch (e) {
      S.error = 'Could not reach the question bank: ' + (e.message || e);
    }
    S.loading = false; render();
  }

  function selectedQuestionIds() {
    const ids = new Set();
    S.selected.forEach(t => (S.topicQ[t] || []).forEach(id => ids.add(id)));
    return [...ids];
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  async function signImages(questions) {
    const paths = [...new Set(questions.flatMap(q => [q.image_path, q.mark_scheme_image_path]).filter(Boolean))];
    const urls = {};
    if (!paths.length) return urls;
    try {
      const { data, error } = await db.storage.from(IMAGE_BUCKET).createSignedUrls(paths, 60 * 60 * 3);
      if (!error && data) data.forEach(d => { if (d.signedUrl && !d.error) urls[d.path] = d.signedUrl; });
    } catch (_) { /* images unavailable; questions still work from text */ }
    return urls;
  }

  async function startSession() {
    S.starting = true; S.error = null; render();
    try {
      const ids = shuffle(selectedQuestionIds()).slice(0, S.questionCount);
      if (!ids.length) throw new Error('No questions found for the selected topics.');
      const { data, error } = await db.from('questions').select(QUESTION_COLUMNS).in('id', ids);
      if (error) throw error;
      const byId = Object.fromEntries(data.map(q => [q.id, q]));
      const queue = ids.map(id => byId[id]).filter(Boolean);
      const images = await signImages(queue);
      beginSession(queue, images);
    } catch (e) {
      S.error = 'Could not start the quiz: ' + (e.message || e);
      S.screen = null;
    }
    S.starting = false; render();
  }

  // ---- Views ----
  function imageBlock(path, label) {
    if (!path) return null;
    const url = S.sess.images[path];
    if (!url) return h('p', { class: 'img-note', text: `${label} diagram isn't available here; use the description in the text.` });
    return h('img', {
      class: 'q-img', src: url, alt: `${label} diagram`, loading: 'lazy',
      onclick: () => { const d = $('#zoom'); d.querySelector('img').src = url; d.showModal(); }
    });
  }

  function viewStartConfig() {
    const usable = (t) => (S.topicQ[t.id] || []).length > 0;
    const setTopics = (topics, on) => {
      topics.filter(usable).forEach(t => on ? S.selected.add(t.id) : S.selected.delete(t.id));
      saveSelection(); render();
    };
    const toggleTopic = (t) => { if (!usable(t)) return; S.selected.has(t.id) ? S.selected.delete(t.id) : S.selected.add(t.id); saveSelection(); render(); };
    const toggleOpen = (m) => { S.expanded.has(m) ? S.expanded.delete(m) : S.expanded.add(m); render(); };
    const available = selectedQuestionIds().length;
    const allUsable = S.topics.filter(usable);

    const moduleBlock = (m) => {
      const topics = S.topics.filter(t => t.module === m.id);
      const live = topics.filter(usable);
      const nSel = live.filter(t => S.selected.has(t.id)).length;
      const qTotal = live.reduce((n, t) => n + S.topicQ[t.id].length, 0);
      const qSel = live.filter(t => S.selected.has(t.id)).reduce((n, t) => n + S.topicQ[t.id].length, 0);
      const all = live.length > 0 && nSel === live.length;
      const open = S.expanded.has(m.id);

      const box = h('input', { type: 'checkbox', checked: all, disabled: !live.length,
        'aria-label': `Select all topics in ${m.name}`,
        onchange: () => setTopics(topics, !all) });
      box.indeterminate = nSel > 0 && !all;

      // group topics by section title, keeping order
      const groups = [];
      topics.forEach(t => { const g = groups[groups.length - 1]; if (g && g.title === t.section) g.items.push(t); else groups.push({ title: t.section, items: [t] }); });

      return h('section', { class: `module-block ${nSel ? 'selected' : ''} ${live.length ? '' : 'empty'}` },
        h('div', { class: 'module-head' },
          box,
          h('button', { class: 'module-title', 'aria-expanded': String(open), onclick: () => toggleOpen(m.id) },
            h('strong', { text: m.name }),
            h('span', { class: 'muted small', text: live.length
              ? `${nSel} of ${live.length} topics · ${qSel} of ${qTotal} questions`
              : 'No questions in the bank yet' }),
          ),
          h('div', { class: 'module-actions' },
            live.length ? h('button', { class: 'btn btn--text small', disabled: all, onclick: () => setTopics(topics, true), text: 'Select all' }) : null,
            nSel ? h('button', { class: 'btn btn--text small', onclick: () => setTopics(topics, false), text: 'Clear' }) : null,
            h('button', { class: 'chev', 'aria-label': open ? 'Hide topics' : 'Show topics', 'aria-expanded': String(open),
              onclick: () => toggleOpen(m.id), text: open ? '▴' : '▾' })
          )
        ),
        open ? h('div', { class: 'topic-list' },
          groups.map(g => [
            groups.length > 1 && g.title ? h('p', { class: 'topic-section', text: g.title }) : null,
            g.items.map(t => {
              const n = (S.topicQ[t.id] || []).length;
              return h('label', { class: `topic-row ${n ? '' : 'empty'}` },
                h('input', { type: 'checkbox', checked: S.selected.has(t.id), disabled: !n, onchange: () => toggleTopic(t) }),
                h('span', { class: 'topic-code', text: t.code }),
                h('span', { class: 'topic-title', text: t.title }),
                h('span', { class: 'topic-count', text: n ? String(n) : '0' })
              );
            })
          ])
        ) : null
      );
    };

    return h('main', { class: 'center center--wide' },
      h('h1', { style: 'font-size: 28px; margin-bottom: 8px;', text: 'OCR A-Level Chemistry Revision' }),
      h('p', { class: 'muted', style: 'margin-bottom: 24px;', text: 'Past-paper questions and mark schemes from your question bank. Choose the topics to include; open a module to pick individual topics.' }),

      S.error ? h('div', { class: 'error-box' }, S.error, ' ',
        h('button', { class: 'btn btn--text', onclick: loadBank, text: 'Try again' })) : null,

      S.loading ? h('p', { class: 'muted', text: 'Loading question bank…' }) : [
        h('div', { style: 'display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom: 12px; flex-wrap:wrap;' },
          h('h3', { style: 'font-size: 16px;', text: 'Modules and topics' }),
          h('div', { style: 'display:flex; gap:16px;' },
            h('button', { class: 'btn btn--text small', disabled: S.selected.size === allUsable.length, onclick: () => setTopics(S.topics, true), text: 'Select everything' }),
            h('button', { class: 'btn btn--text small', disabled: !S.selected.size, onclick: () => setTopics(S.topics, false), text: 'Clear everything' })
          )
        ),
        h('div', { class: 'module-list' }, OCR_MODULES.map(moduleBlock)),

        h('h3', { style: 'font-size: 16px; margin-bottom: 12px;', text: 'Number of questions' }),
        h('div', { class: 'pills' },
          [5, 10, 15, 20].map((cnt) =>
            h('label', { class: 'pill' },
              h('input', { type: 'radio', name: 'count', checked: S.questionCount === cnt,
                onchange: () => { S.questionCount = cnt; render(); } }),
              h('span', { text: `${cnt}` })
            )
          )
        ),

        h('button', {
          class: 'btn',
          style: 'width: 100%; min-height: 54px; font-size: 18px; margin-top: 12px;',
          disabled: S.starting || !available,
          onclick: startSession
        }, S.starting ? 'Loading questions…' : available
            ? `Start quiz (${Math.min(S.questionCount, available)} questions from ${S.selected.size} ${S.selected.size === 1 ? 'topic' : 'topics'})`
            : 'Select at least one topic')
      ]
    );
  }

  // ---- Automatic checking of calculation answers ----
  // Mark schemes often start "If answer = 2.85 OR 2.86, award 3 marks". We compare the student's final number with those values.
  const SUP = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+' };
  function normaliseNumbers(str) {
    let t = String(str || '')
      .replace(/[−–—]/g, '-')
      .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => '^' + m.split('').map(c => SUP[c]).join(''))
      .replace(/,(?=\d{3}\b)/g, '')                                    // 1,000 -> 1000
      .replace(/(\d) (?=\d{3}\b)/g, '$1');                             // 231 000 -> 231000
    // scientific notation: 1.5 x 10^-5, 1.5×10-5, 1.5*10^-5, 1.5e-5
    t = t.replace(/(\d(?:\.\d+)?)\s*[x×*]\s*10\s*\^?\s*([+-]?\d+)/gi, '$1e$2');
    t = t.replace(/\^[+-]?\d+/g, ' ');                                 // unit powers like mol^-1
    return t;
  }
  function numbersIn(str) {
    const t = normaliseNumbers(str);
    const out = [];
    const re = /(?<![A-Za-z\d.])(-?\d+(?:\.\d+)?)(?:e([+-]?\d+))?/g;
    let m;
    while ((m = re.exec(t))) {
      const mant = m[1], exp = m[2] ? parseInt(m[2], 10) : 0;
      const dec = (mant.split('.')[1] || '').length;
      out.push({ value: parseFloat(mant) * Math.pow(10, exp), tol: 0.5 * Math.pow(10, exp - dec) });
    }
    return out;
  }
  function answerRule(ms) {
    const WORDS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6 };
    const m = String(ms || '').match(/answer\s*=\s*([^\n]+?)[,.]?\s*award\s+(?:the\s+)?(?:first\s+)?(\d+|one|two|three|four|five|six)\s+(?:calculation\s+)?marks?/i);
    if (!m) return null;
    const award = /\d/.test(m[2]) ? parseInt(m[2], 10) : WORDS[m[2].toLowerCase()];
    const valueText = m[1].split(/\s+AND\s+|\s+for\s+both|\s+to\s+\d+\s*(?:SF|DP)/i)[0].trim();
    const targets = [];
    valueText.split(/\s+OR\s+|\s*\/\s*/i).forEach(part => {
      const clean = part.replace(/\((?!\d)[^)]*\)/g, ' ');              // drop "(%)", "(K)" etc
      const variants = /(\d)\((\d+)\)/.test(clean)
        ? [clean.replace(/(\d)\((\d+)\)/, '$1'), clean.replace(/(\d)\((\d+)\)/, '$1$2')]
        : [clean];
      variants.forEach(v => { const n = numbersIn(v)[0]; if (n) targets.push(n); });
    });
    return targets.length ? { targets, award, text: valueText } : null;
  }
  function checkCalculation(answer, rule) {
    const nums = numbersIn(answer);
    if (!nums.length) return { status: 'none' };
    const hits = n => rule.targets.some(t => Math.abs(n.value - t.value) <= Math.max(t.tol, n.tol, Math.abs(t.value) * 1e-9));
    // Final answer = numbers on the last non-empty line (or the last number if that line has none)
    const lines = String(answer).split('\n').map(l => l.trim()).filter(Boolean);
    const lastLine = lines.length ? numbersIn(lines[lines.length - 1]) : [];
    const finals = lastLine.length ? lastLine : [nums[nums.length - 1]];
    if (finals.some(hits)) return { status: 'correct' };
    if (nums.some(hits)) return { status: 'inWorking' };
    return { status: 'wrong' };
  }

  function beginSession(queue, images) {
    S.sess = {
      queue, images, i: 0,
      marks: new Array(queue.length).fill(null),
      answers: new Array(queue.length).fill(''),
      selected: new Array(queue.length).fill(null),
      status: new Array(queue.length).fill('open'),   // open | submitted | skipped
      check: new Array(queue.length).fill(null)
    };
    S.screen = 'session';
    render(); window.scrollTo(0, 0);
  }

  // Text with tables: runs of 2+ consecutive lines using "|" with the same number of columns become a table
  function richText(text, cls) {
    const lines = String(text || '').split('\n');
    const cells = l => { let t = l.trim(); if (t.startsWith('|') && t.endsWith('|') && t.length > 1) t = t.slice(1, -1); return t.split('|').map(c => c.trim()); };
    const isRow = l => l.includes('|') && cells(l).length >= 2;
    const out = []; let buf = [];
    const flush = () => { if (buf.length) { out.push(h('div', { class: 'rt-text', text: buf.join('\n') })); buf = []; } };
    for (let i = 0; i < lines.length; ) {
      if (isRow(lines[i])) {
        const n = cells(lines[i]).length; let j = i;
        while (j < lines.length && isRow(lines[j]) && cells(lines[j]).length === n) j++;
        if (j - i >= 2) {
          flush();
          const rows = lines.slice(i, j).map(cells);
          out.push(h('div', { class: 'rt-table-wrap' }, h('table', { class: 'rt-table' },
            h('thead', null, h('tr', null, rows[0].map(c => h('th', { scope: 'col', text: c })))),
            h('tbody', null, rows.slice(1).map(r => h('tr', null, r.map(c => h('td', { text: c })))))
          )));
          i = j; continue;
        }
      }
      buf.push(lines[i]); i++;
    }
    flush();
    return h('div', { class: 'rich-text ' + (cls || '') }, out);
  }

  // "What to revise": the question's revise_note plus its primary plan topic's revision_guide
  function reviseBox(q, extraClass) {
    const t = S.topicById[S.qTopic[q.id]];
    if (!q.revise_note && !(t && t.guide)) return null;
    return h('div', { class: 'revise-box ' + (extraClass || '') },
      h('strong', { class: 'revise-head', text: 'What to revise' }),
      q.revise_note ? h('p', { class: 'revise-note', text: q.revise_note }) : null,
      t ? h('div', { class: 'revise-topic' },
        h('span', { class: 'revise-topic-name', text: `Topic ${t.code} ${t.title}` }),
        t.guide ? h('p', { text: t.guide }) : null
      ) : null
    );
  }

  function viewSession() {
    const s = S.sess;
    const q = s.queue[s.i];
    const isMCQ = q.question_type === 'mcq';
    const mcq = isMCQ ? (parseMCQ(q.question_text) || (correctLetter(q.mark_scheme) ? letterOnlyMCQ(q.question_text) : null)) : null;
    const prompt = mcq ? mcq.prompt : q.question_text;
    const answerKey = mcq ? correctLetter(q.mark_scheme) : null;
    const rule = !mcq ? answerRule(q.mark_scheme) : null;
    const status = s.status[s.i];
    const submitted = status === 'submitted';
    const chosen = s.marks[s.i];
    const check = s.check[s.i];

    const goTo = (i) => { s.i = i; render(); window.scrollTo(0, 0); };
    // Next = the next question still unanswered (searching forward, then from the start); none left = summary
    const nextOpen = () => {
      const n = s.queue.length;
      for (let k = 1; k < n; k++) { const j = (s.i + k) % n; if (s.status[j] === 'open') return j; }
      return -1;
    };
    const advance = () => {
      const j = nextOpen();
      if (j !== -1) return goTo(j);
      S.screen = 'summary'; render(); window.scrollTo(0, 0);
    };
    const finishing = nextOpen() === -1;
    const answerReady = () => mcq ? !!s.selected[s.i] : s.answers[s.i].trim().length > 0;
    const canSubmit = answerReady();

    const submit = () => {
      if (!answerReady()) return;
      s.status[s.i] = 'submitted';
      if (mcq && answerKey) {
        const ok = s.selected[s.i] === answerKey;
        s.marks[s.i] = ok ? q.marks : 0;
        s.check[s.i] = { status: ok ? 'correct' : 'wrong', auto: true };
      } else if (rule) {
        const r = checkCalculation(s.answers[s.i], rule);
        s.check[s.i] = r;
        if (r.status === 'correct') s.marks[s.i] = Math.min(rule.award, q.marks);
      }
      render();
    };
    const skip = () => { s.status[s.i] = 'skipped'; s.marks[s.i] = null; advance(); };
    const unskip = () => { s.status[s.i] = 'open'; render(); };

    // Feedback banner after submitting
    let feedback = null;
    if (submitted && check) {
      const msg = {
        correct: mcq ? `Correct: the answer is ${answerKey}. ${q.marks} ${q.marks === 1 ? 'mark' : 'marks'} awarded.`
                     : `Your final answer matches the mark scheme (${rule.text}). ${Math.min(rule.award, q.marks)} marks awarded automatically. You can change this below.`,
        wrong: mcq ? `Not quite. You chose ${s.selected[s.i]}; the answer is ${answerKey}.`
                   : `Your final answer doesn't match the mark scheme (${rule.text}). Check your working against the mark scheme below. You may still earn method marks.`,
        inWorking: `The correct value (${rule && rule.text}) appears in your working but isn't your final answer. Check the mark scheme and award yourself marks.`,
        none: `No number found in your answer to check. Compare with the mark scheme and award yourself marks.`
      }[check.status];
      feedback = h('div', { class: `feedback feedback--${check.status === 'correct' ? 'good' : check.status === 'wrong' ? 'bad' : 'info'}`, role: 'status', text: msg });
    }

    const needsSelfMark = submitted && !(mcq && answerKey);
    const counts = { done: s.status.filter(x => x === 'submitted').length, skipped: s.status.filter(x => x === 'skipped').length };

    return h('div', { class: 'quiz-container' },
      h('header', { class: 'quiz-header' },
        h('div', { style: 'display:flex; gap:12px; align-items:center; flex-wrap:wrap;' },
          h('span', { class: 'badge', text: `Module ${q.module_id}` }),
          h('strong', { text: `${q.year || ''} ${q.question_ref}`.trim() }),
          h('span', { class: 'muted small', text: `(${s.i + 1} of ${s.queue.length}${counts.skipped ? `, ${counts.skipped} skipped` : ''})` })
        ),
        h('div', { style: 'display:flex; gap:10px; align-items:center;' },
          h('span', { class: 'badge badge-marks', text: `${q.marks} ${q.marks === 1 ? 'mark' : 'marks'}` }),
          h('button', { class: 'btn btn--ghost small', style: 'min-height:36px; padding:4px 12px;',
            onclick: () => { S.screen = null; render(); } }, 'Change modules')
        )
      ),

      h('main', { class: 'quiz-body' },
        h('section', { class: 'pane-left' },
          richText(prompt),
          imageBlock(q.image_path, 'Question')
        ),

        h('section', { class: 'pane-right' },
          h('div', null,
            status === 'skipped' ? h('div', { class: 'feedback feedback--info', style: 'margin-bottom:16px;' },
              'You skipped this question. ', h('button', { class: 'btn btn--text', onclick: unskip, text: 'Answer it now' })) : null,

            mcq ? h('div', null,
              h('p', { class: 'muted small', style: 'margin-bottom:12px;', text: 'SELECT ANSWER:' }),
              mcq.options.map((opt) => {
                let cls = s.selected[s.i] === opt.key ? 'selected' : '';
                if (submitted && answerKey) cls = opt.key === answerKey ? 'correct' : (s.selected[s.i] === opt.key ? 'wrong' : '');
                return h('button', { class: `option-card ${cls}`, disabled: status !== 'open' ? true : null,
                  onclick: () => { s.selected[s.i] = opt.key; render(); } },
                  h('span', { class: 'option-key', text: opt.key }), h('span', { text: opt.text }));
              })
            ) : h('label', { class: 'field' },
              h('span', { text: 'Your answer / working:' }),
              h('textarea', {
                placeholder: rule ? 'Show your working, and put your final answer on the last line…' : 'Type your answer here…',
                readonly: status !== 'open' ? true : null,
                oninput: (e) => {
                  const was = s.answers[s.i].trim().length > 0;
                  s.answers[s.i] = e.target.value;
                  if (was !== (e.target.value.trim().length > 0)) { const b = $('#submit-btn'); if (b) b.disabled = !e.target.value.trim(); }
                }
              }, s.answers[s.i])
            ),

            feedback,

            submitted && ((chosen != null && chosen < q.marks) || (chosen == null && check && check.status === 'wrong')) ? reviseBox(q) : null,

            submitted ? h('div', { class: 'mark-scheme-box', style: 'margin-top:16px;' },
              h('strong', { text: 'Mark scheme:' }),
              richText(q.mark_scheme || 'No mark scheme text; see the image below.', 'ms-text'),
              imageBlock(q.mark_scheme_image_path, 'Mark scheme')
            ) : null,

            needsSelfMark ? h('div', { style: 'margin-top:20px;' },
              h('p', { class: 'muted small', text: `AWARD MARKS (OUT OF ${q.marks}):` }),
              h('div', { class: 'mark-btn-group' },
                Array.from({ length: q.marks + 1 }, (_, n) => h('button', {
                  class: 'mark-btn', 'aria-pressed': String(chosen === n),
                  onclick: () => { s.marks[s.i] = n; render(); }, text: String(n)
                }))
              )
            ) : null
          ),

          h('div', { class: 'nav-row' },
            h('button', { class: 'btn btn--ghost', disabled: s.i === 0, onclick: () => goTo(s.i - 1) }, 'Previous'),
            h('div', { style: 'display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;' },
              status === 'open' ? [
                h('button', { class: 'btn btn--ghost', onclick: skip }, 'Skip'),
                h('button', { id: 'submit-btn', class: 'btn', disabled: !canSubmit, onclick: submit }, 'Submit answer')
              ] : status === 'skipped' ? [
                h('button', { class: 'btn', onclick: advance }, finishing ? 'Finish' : 'Next question')
              ] : [
                h('button', { class: 'btn', disabled: chosen == null, onclick: advance,
                  title: chosen == null ? 'Award yourself marks first' : null }, finishing ? 'Finish' : 'Next question')
              ]
            )
          ),
          needsSelfMark && chosen == null ? h('p', { class: 'muted small', style: 'text-align:right; margin:0;', text: 'Award yourself marks to continue.' }) : null
        )
      )
    );
  }

  function viewSummary() {
    const s = S.sess;
    const answered = s.queue.map((q, i) => ({ q, i })).filter(x => s.status[x.i] === 'submitted');
    const skipped = s.status.filter(x => x === 'skipped').length;
    const earned = answered.reduce((a, x) => a + (s.marks[x.i] || 0), 0);
    const possible = answered.reduce((a, x) => a + x.q.marks, 0);
    const pct = possible > 0 ? Math.round((earned / possible) * 100) : 0;
    const byModule = {};
    answered.forEach(({ q, i }) => {
      const b = byModule[q.module_id] || (byModule[q.module_id] = { e: 0, p: 0 });
      b.e += s.marks[i] || 0; b.p += q.marks;
    });
    const firstSkipped = s.status.indexOf('skipped');
    // Revision list: questions that lost marks, grouped by primary topic (in syllabus order)
    const missed = answered.filter(({ q, i }) => (s.marks[i] || 0) < q.marks);
    const groups = {};
    missed.forEach(x => { const tid = S.qTopic[x.q.id] || 0; (groups[tid] = groups[tid] || []).push(x); });
    const order = Object.keys(groups).sort((a, b) => ((S.topicById[a] || {}).sort || 1e9) - ((S.topicById[b] || {}).sort || 1e9));

    return h('main', { class: 'center' },
      h('div', { class: 'summary-container' },
        h('h1', { text: 'Quiz complete' }),
        h('div', { class: 'score-circle', text: possible ? `${earned} / ${possible} (${pct}%)` : 'No answers' }),
        h('p', { class: 'muted', text: `${answered.length} answered${skipped ? `, ${skipped} skipped (not counted in the score)` : ''}` }),
        h('div', { class: 'breakdown' },
          Object.entries(byModule).map(([mod, b]) =>
            h('div', null, h('span', { text: `Module ${mod}` }), h('strong', { text: `${b.e} / ${b.p}` })))
        ),
        missed.length ? h('section', { class: 'revision-list' },
          h('h2', { text: 'Your revision list' }),
          h('p', { class: 'muted small', text: `From the ${missed.length} ${missed.length === 1 ? 'question' : 'questions'} where you dropped marks.` }),
          order.map(tid => {
            const t = S.topicById[tid];
            return h('div', { class: 'revision-topic' },
              h('h3', { text: t ? `${t.code} ${t.title}` : 'Other' }),
              t && t.guide ? h('p', { class: 'muted', text: t.guide }) : null,
              h('ul', null, groups[tid].map(({ q, i }) =>
                h('li', null,
                  h('span', { class: 'revision-ref', text: `${q.year || ''} ${q.question_ref} · ${s.marks[i] || 0}/${q.marks}`.trim() }),
                  q.revise_note ? h('span', { text: q.revise_note }) : null)))
            );
          })
        ) : (answered.length ? h('p', { class: 'feedback feedback--good', style: 'text-align:center;', text: 'Full marks on everything you answered. Nothing to add to your revision list.' }) : null),
        h('div', { style: 'display:flex; gap:12px; justify-content:center; margin-top:24px; flex-wrap:wrap;' },
          skipped ? h('button', { class: 'btn', onclick: () => { s.i = firstSkipped; S.screen = 'session'; render(); } }, 'Go back to skipped') : null,
          h('button', { class: skipped ? 'btn btn--ghost' : 'btn', onclick: () => { S.screen = null; render(); } }, 'New quiz'),
          h('button', { class: 'btn btn--ghost', onclick: () => beginSession(s.queue, s.images) }, 'Retry same questions')
        )
      )
    );
  }

  function render() {
    const app = $('#app');
    app.innerHTML = '';
    if (S.screen === 'session') app.appendChild(viewSession());
    else if (S.screen === 'summary') app.appendChild(viewSummary());
    else app.appendChild(viewStartConfig());
  }

  $('#zoom button').addEventListener('click', () => $('#zoom').close());
  render();
  loadBank();
});
</script>
</body>
</html>
