<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR A-Level Chemistry - Official Examination Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.4.1/dist/smiles-drawer.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<style>
  :root {
    --paper-bg: #FFFFFF;
    --paper-ink: #000000;
    --ui-bg: #0F172A;
    --ui-panel: #1E293B;
    --ui-border: #334155;
    --ui-text: #F8FAFC;
    --ui-muted: #94A3B8;
    --action: #0EA5E9;
    --action-hover: #0284C7;
    --warn: #F59E0B;
    --danger: #F87171;
    --ok: #34D399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--ui-bg);
    color: var(--ui-text);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.5;
  }

  /* Config & Generator Screen */
  .config-shell { max-width: 860px; margin: 40px auto; padding: 32px; background: var(--ui-panel); border: 1px solid var(--ui-border); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
  @media (max-width: 640px) { .config-shell { margin: 0; border-radius: 0; padding: 20px 16px; } }
  h1 { font-family: 'Times New Roman', Times, serif; font-size: 32px; margin-bottom: 8px; color: #FFF; }
  p { margin: 0 0 20px; color: var(--ui-muted); }
  .step-title { color: #FFF; font-size: 16px; margin: 26px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .step-title small { font-weight: 500; color: var(--ui-muted); font-size: 13px; }

  .preset-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 8px; }
  @media (min-width: 640px) { .preset-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 820px) { .preset-grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }

  .preset-card { padding: 16px; border: 2px solid var(--ui-border); border-radius: 12px; background: rgba(15, 23, 42, 0.6); cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease; position: relative; }
  .preset-card:hover { border-color: var(--action); }
  .preset-card.selected { border-color: var(--action); background: rgba(14, 165, 233, 0.15); }
  .preset-card h3 { font-size: 15px; margin: 0 0 6px 0; color: #FFF; }
  .preset-card p { font-size: 12px; margin: 0 0 8px 0; color: var(--ui-muted); }
  .preset-badge { display: inline-block; padding: 3px 8px; background: rgba(14, 165, 233, 0.2); color: var(--action); border-radius: 4px; font-size: 11px; font-weight: 700; }

  .custom-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin: 14px 0 0; padding: 12px 14px; border: 1px dashed var(--ui-border); border-radius: 10px; font-size: 14px; }
  .custom-row select, .settings input[type=password], .settings input[type=text], .settings select { background: #0F172A; color: #FFF; border: 1px solid var(--ui-border); border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 14px; }
  .custom-row label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

  .mini-btn { background: transparent; color: var(--action); border: 1px solid var(--ui-border); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .mini-btn:hover { border-color: var(--action); }

  .module-list { display: flex; flex-direction: column; gap: 10px; }
  .module-card { border: 1.5px solid var(--ui-border); border-radius: 10px; background: rgba(15,23,42,0.45); }
  .module-card.selected { border-color: var(--action); background: rgba(14, 165, 233, 0.10); }
  .module-card.partial { border-color: rgba(14,165,233,0.55); }
  .module-head { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; }
  .module-head input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--action); flex-shrink: 0; cursor: pointer; }
  .module-head .mod-text { flex: 1; cursor: pointer; }
  .module-head strong { color: #FFF; font-size: 14px; }
  .module-head .mod-desc { font-size: 12px; color: var(--ui-muted); display: block; margin-top: 2px; }
  .topic-count { font-size: 12px; color: var(--ui-muted); white-space: nowrap; margin-top: 2px; }
  .expand-btn { background: transparent; border: 1px solid var(--ui-border); color: #FFF; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .expand-btn:hover { border-color: var(--action); }
  .topic-grid { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 0 14px 14px 44px; }
  @media (min-width: 560px) { .topic-grid { grid-template-columns: 1fr 1fr; } }
  .topic-chip { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #E2E8F0; cursor: pointer; padding: 5px 8px; border-radius: 6px; }
  .topic-chip:hover { background: rgba(255,255,255,0.05); }
  .topic-chip input { accent-color: var(--action); margin-top: 3px; cursor: pointer; }
  .topic-chip .tid { color: var(--ui-muted); font-variant-numeric: tabular-nums; min-width: 38px; }

  .source-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .source-grid { grid-template-columns: 1fr 1fr; } }

  .settings { margin-top: 12px; padding: 16px; border: 1px solid var(--ui-border); border-radius: 10px; background: rgba(15,23,42,0.5); font-size: 14px; }
  .settings .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .settings .field label { font-weight: 600; color: #FFF; font-size: 13px; }
  .settings .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .settings .row input[type=password], .settings .row input[type=text] { flex: 1; min-width: 200px; }
  .settings .hint { font-size: 12px; color: var(--ui-muted); margin: 0; }
  .settings a { color: var(--action); }
  .status-ok { color: var(--ok); font-size: 13px; }
  .provider-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .provider-btn { background: #0F172A; color: #FFF; border: 1.5px solid var(--ui-border); border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .provider-btn:hover { border-color: var(--action); }
  .provider-btn.selected { border-color: var(--action); background: rgba(14,165,233,0.15); }
  .provider-btn .has-key { color: var(--ok); }
  #customModel { margin-top: 6px; }
  .status-err { color: var(--danger); font-size: 13px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 24px; background: var(--action); color: #0F172A; font-weight: 700; border: 0; border-radius: 8px; cursor: pointer; width: 100%; font-size: 17px; font-family: inherit; margin-top: 26px; }
  .btn:hover { background: var(--action-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: #FFF; border: 1px solid var(--ui-border); border-radius: 6px; cursor: pointer; font-family: inherit; }
  .config-error { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--danger); background: rgba(248,113,113,0.1); color: #FECACA; border-radius: 8px; font-size: 14px; }
  .config-note { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--warn); background: rgba(245,158,11,0.1); color: #FDE68A; border-radius: 8px; font-size: 14px; }

  /* Busy overlay */
  .busy-overlay { position: fixed; inset: 0; background: rgba(2,6,23,0.75); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
  .busy-card { background: var(--ui-panel); border: 1px solid var(--ui-border); border-radius: 14px; padding: 28px; max-width: 440px; width: 100%; }
  .busy-card h3 { margin: 0 0 6px; color: #FFF; }
  .busy-card ul { list-style: none; padding: 0; margin: 14px 0 0; font-size: 14px; }
  .busy-card li { padding: 4px 0; color: var(--ui-muted); display: flex; gap: 8px; align-items: center; }
  .busy-card li.done { color: var(--ok); }
  .busy-card li.err { color: var(--danger); }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--ui-border); border-top-color: var(--action); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Navigation Bar */
  .exam-toolbar { background: #0F172A; color: #FFF; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--ui-border); flex-wrap: wrap; gap: 10px; }
  .nav-btn-group { display: flex; align-items: center; gap: 8px; }
  .exam-toolbar button, .exam-toolbar select { background: #334155; color: #FFF; border: 0; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit; }
  .exam-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .exam-toolbar button:hover:not(:disabled) { background: #475569; }

  /* Multi-Page A4 Sheet Rendering */
  .exam-sheet-container { padding: 20px 0 80px; overflow-x: auto; }
  .page-sheet {
    background: var(--paper-bg);
    color: var(--paper-ink);
    font-family: 'Times New Roman', Times, Georgia, serif;
    font-size: 12pt;
    line-height: 1.6;
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 30px auto;
    padding: 22mm 18mm 25mm;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    border: 1px solid #CBD5E1;
    position: relative;
    box-sizing: border-box;
  }
  .page-sheet.hidden { display: none; }

  /* Page Headers & Footers */
  .exam-header { border-bottom: 2.5px solid #000; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
  .exam-header-left h2 { font-size: 17pt; font-weight: bold; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: -0.5px; }
  .exam-header-left p { font-size: 11pt; margin: 0; color: #000; }
  .exam-header-right { text-align: right; font-size: 11pt; font-weight: bold; }

  .exam-instructions { border: 1.5px solid #000; padding: 12px 16px; margin-bottom: 28px; font-size: 10pt; background: #FAF9F6; }
  .exam-instructions ul { margin: 4px 0 0 18px; padding: 0; }
  .content-covered { font-size: 9.5pt; margin: 8px 0 0; color: #000; }

  .page-footer { position: absolute; bottom: 12mm; left: 18mm; right: 18mm; border-top: 1px solid #000; padding-top: 6px; display: flex; justify-content: space-between; font-size: 10pt; font-weight: bold; }

  .section-title { font-size: 14pt; font-weight: bold; border-bottom: 1px solid #000; margin: 25px 0 16px; padding-bottom: 4px; text-transform: uppercase; }

  .question-block { margin-bottom: 25px; page-break-inside: avoid; }
  .question-top { display: flex; justify-content: space-between; align-items: baseline; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #E2E8F0; padding-bottom: 4px; }
  .question-top .topic-tag { font-weight: normal; font-size: 9pt; color: #64748B; font-family: 'Inter', sans-serif; }
  .question-text { margin-bottom: 10px; text-align: justify; }

  .subquestion-block { margin-left: 20px; margin-top: 14px; border-left: 2px solid #E2E8F0; padding-left: 14px; page-break-inside: avoid; }
  .subquestion-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 11pt; margin-bottom: 6px; }

  .mcq-grid { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 14px 16px; }
  .mcq-option { display: flex; gap: 12px; align-items: center; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; background: transparent; font: inherit; text-align: left; color: inherit; }
  .mcq-option:hover { border-color: #CBD5E1; }
  .mcq-option.chosen { border-color: #0284C7; background: #F0F9FF; }
  .mcq-option .letter { font-weight: bold; width: 26px; height: 26px; border: 1.5px solid #000; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mcq-option.chosen .letter { background: #000; color: #FFF; }
  .mcq-option .opt-structure { display: inline-block; }

  .answer-space { border: 1px dashed #94A3B8; min-height: 80px; margin-top: 10px; padding: 10px; background: #FAFAFA; border-radius: 4px; }
  .answer-space textarea { width: 100%; height: 100%; min-height: 65px; border: 0; background: transparent; font-family: 'Times New Roman', Times, serif; font-size: 11pt; resize: vertical; outline: none; }

  .mark-scheme-drawer { margin-top: 12px; background: #F0FDF4; border: 1.5px solid #16A34A; padding: 12px; font-family: 'Inter', sans-serif; font-size: 10pt; color: #166534; border-radius: 6px; display: none; }
  .mark-scheme-drawer.visible { display: block; }
  .mark-btn-row { margin-top: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mark-btn { padding: 4px 12px; border: 1px solid #16A34A; background: #FFF; color: #166534; font-weight: bold; border-radius: 4px; cursor: pointer; }
  .mark-btn.active { background: #16A34A; color: #FFF; }

  .auto-eval-box { margin-top: 8px; padding: 10px; border-radius: 6px; font-size: 10.5pt; font-family: 'Inter', sans-serif; display: none; }
  .auto-eval-box.correct { background: #ECFDF5; border: 1px solid #10B981; color: #065F46; display: block; }
  .auto-eval-box.partial { background: #FFFBEB; border: 1px solid #F59E0B; color: #92400E; display: block; }
  .auto-eval-box.incorrect { background: #FEF2F2; border: 1px solid #EF4444; color: #991B1B; display: block; }
  .auto-eval-box.pending { background: #F1F5F9; border: 1px solid #94A3B8; color: #334155; display: block; }

  .q-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; gap: 8px; }
  .submit-answer-btn { background: #0284C7; color: #FFF; border: 0; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; margin-top: 8px; font-family: 'Inter', sans-serif; }
  .submit-answer-btn:hover { background: #0369A1; }
  .submit-answer-btn:disabled { opacity: 0.6; cursor: wait; }
  .reveal-btn { color: #0284C7; background: #FFF; border: 1px solid #CBD5E1; padding: 4px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; font-family: 'Inter', sans-serif; }

  /* Figures */
  .exam-figure { margin: 12px auto 14px; text-align: center; page-break-inside: avoid; }
  .exam-figure svg.fig-svg { width: 100%; max-width: 150mm; height: auto; display: block; margin: 0 auto; }
  .exam-figure img.fig-img { max-width: 100%; max-height: 125mm; width: auto; height: auto; }
  .ms-figure { margin: 8px 0 4px; text-align: left; }
  .ms-figure img.fig-img { max-width: 100%; max-height: 90mm; width: auto; height: auto; border: 1px solid #BBF7D0; background: #FFF; }
  .q-table { border-collapse: collapse; margin: 8px 0 10px; font-size: 11pt; }
  .q-table th, .q-table td { border: 1px solid #000; padding: 3px 10px; text-align: center; }
  .q-table th { font-weight: bold; background: #F8FAFC; }
  .mark-scheme-drawer .q-table, .mark-scheme-item .q-table { font-size: 9.5pt; }
  .mark-scheme-drawer .q-table td, .mark-scheme-item .q-table td { border-color: #16A34A; }
  .mcq-letters { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 12px 16px; }
  .mcq-letters .mcq-option { padding: 2px; }
  .source-tag { font-weight: normal; font-size: 9pt; color: #64748B; font-family: 'Inter', sans-serif; margin-left: 6px; }
  .self-mark-note { margin-top: 10px; padding: 10px 12px; border: 1px dashed #64748B; background: #F8FAFC; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 10pt; color: #334155; }
  .saved-tag { font-family: 'Inter', sans-serif; font-size: 9pt; margin-top: 4px; color: #15803D; }
  .saved-tag.err { color: #B91C1C; }
  .db-opts { margin-top: 12px; padding: 14px 16px; border: 1px solid var(--ui-border); border-radius: 10px; background: rgba(15,23,42,0.5); font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
  .db-opts label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; cursor: pointer; }
  .db-opts select { background: #0F172A; color: #FFF; border: 1px solid var(--ui-border); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; max-width: 100%; }
  .db-opts input { accent-color: var(--action); }
  .topic-chip .tcount { color: var(--ui-muted); font-size: 11px; margin-left: auto; padding-left: 6px; white-space: nowrap; }
  .preset-card.disabled { opacity: 0.55; cursor: not-allowed; }
  .account-row input[type=email], .account-row input[type=password] { flex: 1; min-width: 160px; background: #0F172A; color: #FFF; border: 1px solid var(--ui-border); border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 14px; }
  .exam-figure figcaption { font-size: 10pt; margin-top: 4px; font-style: italic; }
  .fig-table { border-collapse: collapse; margin: 0 auto; font-size: 11pt; }
  .fig-table th, .fig-table td { border: 1px solid #000; padding: 4px 12px; text-align: center; }
  .fig-table th { font-weight: bold; background: #F8FAFC; }
  .structure-row { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: flex-end; }
  .structure-item { text-align: center; }
  .structure-item .struct-label { font-size: 11pt; margin-top: 2px; }
  .smiles-slot { display: inline-block; min-width: 120px; min-height: 60px; }
  .smiles-slot svg { width: 230px; height: 150px; }
  .mcq-option .smiles-slot svg { width: 170px; height: 105px; }
  .fig-fallback { display: inline-block; border: 1px dashed #94A3B8; padding: 8px 12px; font-size: 10pt; font-family: 'Inter', sans-serif; color: #475569; }

  /* Revision guide */
  .revision-box { margin-top: 8px; border: 1.5px solid #6366F1; background: #EEF2FF; color: #1E1B4B; border-radius: 6px; padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 10pt; }
  .revision-box summary { cursor: pointer; font-weight: 700; color: #3730A3; }
  .revision-box ul { margin: 6px 0 4px 18px; padding: 0; }
  .revision-box li { margin-bottom: 3px; }
  .revision-box p { color: #1E1B4B; margin: 4px 0; }
  .rev-btn { background: #4F46E5; color: #FFF; border: 0; padding: 5px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; font-family: 'Inter', sans-serif; margin-top: 6px; }
  .rev-btn:hover { background: #4338CA; }
  .rev-btn:disabled { opacity: 0.6; cursor: wait; }
  .page-sheet p { color: inherit; }
  .rev-explain { margin-top: 8px; padding: 8px 10px; background: #FFF; border: 1px solid #C7D2FE; border-radius: 6px; color: #1E1B4B; font-family: 'Inter', sans-serif; font-size: 10pt; }
  .rev-explain p, .rev-explain li { color: #1E1B4B; font-size: 10pt; }
  .rev-explain ul { margin: 4px 0 4px 18px; padding: 0; }
  .rev-h { font-size: 11pt; margin: 12px 0 4px; color: #1E1B4B; }
  .rev-topic { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px dotted #CBD5E1; page-break-inside: avoid; }
  .rev-topic-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; font-size: 12pt; }
  .rev-topic ul { margin: 6px 0 6px 20px; padding: 0; font-size: 11pt; }
  .rev-missed { font-size: 10pt; color: #475569; font-family: 'Inter', sans-serif; }
  .rev-empty { font-size: 12pt; padding: 20px 0; }
  .rev-plan { font-family: 'Inter', sans-serif; font-size: 10.5pt; background: #EEF2FF; border: 1.5px solid #6366F1; border-radius: 8px; padding: 12px 16px; margin: 10px 0 20px; color: #1E1B4B; }
  .rev-plan p, .rev-plan li { color: #1E1B4B; }
  .rev-plan ul { margin: 4px 0 6px 18px; padding: 0; }

  /* Mark Scheme Section (Section 2) Styling */
  .mark-scheme-item { margin-bottom: 20px; border-bottom: 1px dotted #CBD5E1; padding-bottom: 12px; page-break-inside: avoid; }
  .mark-scheme-item-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 11pt; margin-bottom: 4px; }

  .score-summary-bar { background: #1E293B; color: #FFF; padding: 14px 24px; position: sticky; bottom: 0; z-index: 90; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--ui-border); font-family: 'Inter', sans-serif; flex-wrap: wrap; gap: 10px; }
  .score-summary-bar button { padding: 6px 14px; }
  .score-summary-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

  @media print {
    body { background: #FFF; color: #000; }
    .exam-toolbar, .config-shell, .score-summary-bar, .submit-answer-btn, .reveal-btn, .auto-eval-box, .busy-overlay { display: none !important; }
    .page-sheet { display: block !important; box-shadow: none; border: 0; margin: 0; padding: 10mm; width: 100%; page-break-after: always; position: relative; min-height: auto; }
    .mark-scheme-drawer { display: none !important; }
    .answer-space textarea { display: none; }
    .mcq-option.chosen { background: transparent; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

/* ============================================================
   1. SPECIFICATION: OCR A Level Chemistry A (H432) modules & topics
   ============================================================ */
const OCR_MODULES = [

function esc(s) {

// Escape, then re-allow a small set of formatting tags. Safe for content written by Claude.
function fmtInline(s) {

function fmt(s) {

    out.push({ t: `${indent ? '&nbsp;'.repeat(indent * 2) : ''}${m[2] ? '• ' : ''}${fmtInline(m[3])}` });

// SVG text with <sub>/<sup> support via tspans.
function svgText(s) {

    if (!txt) return;

  while ((m = re.exec(src))) {

/* Generic x–y graph on exam-style graph paper */
function figGraph(f) {
  const W = 620, H = 380;

  if (!cats && series.some(s => s.points.some(p => typeof p[0] === 'string'))) {

  }

  if (!cats) xT.ticks.forEach(v => { if (v < x0 - 1e-9 || v > x1 + 1e-9) return; s += `<line y1="${m.t}" y2="${m.t + ph}" x1="${sx(v)}" x2="${sx(v)}" stroke="#C7CDD6" stroke-width="0.9"/>`; if (!f.hideXTicks) s += `<text x="${sx(v)}" y="${m.t + ph + 20}" text-anchor="middle" font-size="13">${esc(fmtNum(v))}</text>`; });

/* Reaction enthalpy profile */

/* Thin-layer chromatogram */
function figTLC(f) {
  const lanes = f.lanes || [];
  const front = +(f.solventFront || 8);
  const px = 300 / (front + 1.2), baseY = 360, plateX = 60, plateW = 90 * Math.max(1, lanes.length) + 20;
  const W = plateX + plateW + 115, H = 400;
  let s = svgOpen(W, H) + arrowDefs + `<rect width="${W}" height="${H}" fill="#fff"/>`;
  s += `<rect x="${plateX}" y="20" width="${plateW}" height="370" fill="#FAFAF7" stroke="#000" stroke-width="2"/>`;
  s += `<line x1="${plateX}" x2="${plateX + plateW}" y1="${baseY}" y2="${baseY}" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/><text x="${plateX + plateW + 8}" y="${baseY + 5}" font-size="13">baseline</text>`;
  const fy = baseY - front * px;
  s += `<line x1="${plateX}" x2="${plateX + plateW}" y1="${fy}" y2="${fy}" stroke="#000" stroke-width="1.4"/><text x="${plateX + plateW + 8}" y="${fy + 5}" font-size="13">solvent front</text>`;
  if (f.showDistances !== false) { const ax = plateX - 22; s += `<line x1="${ax}" x2="${ax}" y1="${baseY}" y2="${fy + 2}" stroke="#000" stroke-width="1" marker-end="url(#ah)"/><text transform="translate(${ax - 8} ${(baseY + fy) / 2}) rotate(-90)" text-anchor="middle" font-size="13">${esc(fmtNum(front))} cm</text>`; }
  lanes.forEach((ln, i) => {
    const x = plateX + 55 + i * 90;
    s += `<text x="${x}" y="${baseY + 24}" text-anchor="middle" font-size="14">${svgText(ln.label || '')}</text><path d="M${x - 4},${baseY - 4} L${x + 4},${baseY + 4} M${x - 4},${baseY + 4} L${x + 4},${baseY - 4}" stroke="#000"/>`;
    (ln.spots || []).forEach(d => { const y = baseY - (+d) * px; s += `<ellipse cx="${x}" cy="${y}" rx="11" ry="8" fill="#6B7280" stroke="#000"/>`; if (f.showDistances !== false && f.labelSpots) s += `<text x="${x + 16}" y="${y + 4}" font-size="12">${esc(fmtNum(+d))} cm</text>`; });
  });
  return s + '</svg>';
}

/* Data table */
function figTable(f) {
  const headers = f.headers || [];

}

const EXAM_THEME = { FOREGROUND: '#000000', BACKGROUND: '#ffffff', C: '#000000', O: '#000000', N: '#000000', F: '#000000', CL: '#000000', BR: '#000000', I: '#000000', P: '#000000', S: '#000000', B: '#000000', SI: '#000000', H: '#000000' };

function getDrawer() {

  if (!svgDrawer) svgDrawer = new SmilesDrawer.SvgDrawer({ width: 260, height: 170, bondThickness: 1.3, padding: 14, fontSizeLarge: 12, fontSizeSmall: 8, compactDrawing: false, themes: { exam: EXAM_THEME, light: EXAM_THEME } });

}
function smilesIsValid(smiles) {
  if (!window.SmilesDrawer) return true; // cannot check yet
  let ok = false;
  try { SmilesDrawer.parse(String(smiles), () => { ok = true; }, () => { ok = false; }); } catch (e) { ok = false; }

function drawStructures(root) {
  root.querySelectorAll('.smiles-slot[data-smiles]').forEach(slot => {
    const smi = slot.getAttribute('data-smiles');
    if (slot.dataset.drawn === '1') return;
    if (smilesCache[smi]) { slot.innerHTML = smilesCache[smi]; slot.dataset.drawn = '1'; return; }
    const drawer = getDrawer();
    if (!drawer) { slot.innerHTML = `<span class="fig-fallback">Loading structure…</span>`; return; }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    slot.innerHTML = ''; slot.appendChild(svg);
    try {
      SmilesDrawer.parse(smi, (tree) => {

}

function figureBody(f) {

  try {

    const kind = String(f.kind || '').toLowerCase();
    if (kind === 'structure') {

  const pts = [], Ka = 1.74e-5, c = 0.1, Va = 25;
  range(0, 50, 0.25).forEach(V => {

    { id: 'm321', topic: '3.2.1', stem: 'In a calorimetry experiment, 50.0 g of water is heated through 6.0 K. The specific heat capacity of water is 4.18 J g<sup>−1</sup> K<sup>−1</sup>. How much energy is transferred to the water?', options: ['0.21 kJ', '1.25 kJ', '12.5 kJ', '125 kJ'], answer: 'B', mark_scheme: 'B — q = mcΔT = 50.0 × 4.18 × 6.0 = 1254 J = 1.25 kJ.' },
    { id: 'm321b', topic: '3.2.1', stem: 'The enthalpy profile diagram for a reaction is shown. Which statement is correct?', figure: { kind: 'energy_profile', exothermic: true, reactants: 'Reactants', products: 'Products' }, options: ['The reaction is endothermic and ΔH is positive.', 'The reaction is exothermic and ΔH is negative.', 'The activation energy is smaller than the magnitude of ΔH.', 'The products have more energy than the reactants.'], answer: 'B', mark_scheme: 'B — products are at a lower enthalpy than reactants, so energy is released (ΔH negative).' },
    { id: 'm322', topic: '3.2.2', stem: 'The Boltzmann distributions for the same gas at two temperatures, T<sub>1</sub> and T<sub>2</sub>, are shown. Which statement is correct?', figure: { kind: 'graph', xLabel: 'Energy', yLabel: 'Number of molecules', hideXTicks: true, hideYTicks: true, yMin: 0, yMax: 50, series: [{ type: 'curve', label: 'T<sub>1</sub>', points: mbCurve(1.0) }, { type: 'curve', dashed: true, label: 'T<sub>2</sub>', labelAt: 0.4, points: mbCurve(1.8) }] }, options: ['T<sub>2</sub> is lower than T<sub>1</sub> because its peak is lower.', 'The area under the T<sub>2</sub> curve is larger than under T<sub>1</sub>.', 'T<sub>2</sub> is higher than T<sub>1</sub>; more molecules have high energies.', 'The most probable energy is the same at both temperatures.'], answer: 'C', mark_scheme: 'C — at higher temperature the peak is lower and moves to higher energy; area (total number of molecules) is unchanged.' },
    { id: 'm323', topic: '3.2.3', stem: 'N<sub>2</sub>(g) + 3H<sub>2</sub>(g) <=> 2NH<sub>3</sub>(g)   ΔH = −92 kJ mol<sup>−1</sup><br>Which change increases the equilibrium yield of ammonia?', options: ['Increasing the temperature', 'Decreasing the pressure', 'Adding an iron catalyst', 'Increasing the pressure'], answer: 'D', mark_scheme: 'D — equilibrium shifts to the side with fewer moles of gas (2 vs 4).' },
    { id: 'm411', topic: '4.1.1', stem: 'What is the systematic name of the compound shown?', figure: { kind: 'structure', smiles: 'CC(C)CC' }, options: ['pentane', '2-methylbutane', '3-methylbutane', '2,2-dimethylpropane'], answer: 'B', mark_scheme: 'B — longest chain is four carbons, methyl group on carbon 2 (lowest locant).' },
    { id: 'm412', topic: '4.1.2', stem: 'What is the initiation step in the radical substitution of methane with chlorine?', options: ['Cl<sub>2</sub> → 2Cl•', 'CH<sub>4</sub> + Cl• → CH<sub>3</sub>• + HCl', 'CH<sub>3</sub>• + Cl<sub>2</sub> → CH<sub>3</sub>Cl + Cl•', 'CH<sub>3</sub>• + Cl• → CH<sub>3</sub>Cl'], answer: 'A', mark_scheme: 'A — homolytic fission of Cl–Cl by UV radiation.' },
    { id: 'm413', topic: '4.1.3', stem: 'What is the major product when propene reacts with hydrogen bromide?', options: ['1-bromopropane', '2-bromopropane', '1,2-dibromopropane', 'propan-2-ol'], answer: 'B', mark_scheme: 'B — Markownikoff: the more stable secondary carbocation forms.' },
    { id: 'm421', topic: '4.2.1', stem: 'Which alcohol is <b>not</b> oxidised when heated with acidified potassium dichromate(VI)?', options: ['butan-1-ol', 'butan-2-ol', '2-methylpropan-1-ol', '2-methylpropan-2-ol'], answer: 'D', mark_scheme: 'D — a tertiary alcohol has no hydrogen on the carbon bonded to –OH.' },
    { id: 'm422', topic: '4.2.2', stem: 'Which haloalkane is hydrolysed fastest by warm aqueous sodium hydroxide?', options: ['1-fluorobutane', '1-chlorobutane', '1-bromobutane', '1-iodobutane'], answer: 'D', mark_scheme: 'D — the C–I bond has the lowest bond enthalpy, so it breaks most easily.' },
    { id: 'm423', topic: '4.2.3', stem: 'Which conditions convert ethanol into ethanoic acid?', options: ['Acidified K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>, distil as it forms', 'Excess acidified K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>, heat under reflux', 'Concentrated H<sub>3</sub>PO<sub>4</sub>, heat', 'NaBr and H<sub>2</sub>SO<sub>4</sub>, heat'], answer: 'B', mark_scheme: 'B — reflux with excess oxidising agent gives complete oxidation to the carboxylic acid.' },
    { id: 'm424', topic: '4.2.4', stem: 'The infrared spectrum of an organic compound is shown. Which type of compound is it?', figure: { kind: 'spectrum', spectrumType: 'ir', peaks: [{ x: 3000, height: 50, width: 260 }, { x: 2950, height: 18, width: 40 }, { x: 1710, height: 72, width: 28 }, { x: 1250, height: 40, width: 40 }, { x: 930, height: 20, width: 50 }] }, options: ['an alcohol', 'an aldehyde', 'a carboxylic acid', 'an ester'], answer: 'C', mark_scheme: 'C — very broad O–H absorption at 2500–3300 cm<sup>−1</sup> together with C=O at about 1710 cm<sup>−1</sup>.' },
    { id: 'm424b', topic: '4.2.4', stem: 'The mass spectrum of an organic compound is shown. Which compound produced this spectrum?', figure: { kind: 'spectrum', spectrumType: 'ms', peaks: [{ x: 15, height: 8 }, { x: 27, height: 22 }, { x: 29, height: 26 }, { x: 31, height: 100 }, { x: 45, height: 38 }, { x: 46, height: 20 }] }, options: ['ethanol, C<sub>2</sub>H<sub>5</sub>OH', 'propane, C<sub>3</sub>H<sub>8</sub>', 'methanol, CH<sub>3</sub>OH', 'ethanal, CH<sub>3</sub>CHO'], answer: 'A', mark_scheme: 'A — molecular ion peak at m/z = 46; peak at 31 is CH<sub>2</sub>OH<sup>+</sup>.' },
    { id: 'm511', topic: '5.1.1', stem: 'The rate constant, k, for a first-order reaction is 6.19 × 10<sup>−3</sup> s<sup>−1</sup>. What is the half-life?', options: ['49 s', '112 s', '323 s', '429 s'], answer: 'B', mark_scheme: 'B — t<sub>½</sub> = ln 2 ÷ k = 0.693 ÷ 6.19 × 10<sup>−3</sup> = 112 s.' },
    { id: 'm511b', topic: '5.1.1', stem: 'The rate equation for a reaction is rate = k[A]<sup>2</sup>[B]. What are the units of k?', options: ['mol dm<sup>−3</sup> s<sup>−1</sup>', 's<sup>−1</sup>', 'dm<sup>3</sup> mol<sup>−1</sup> s<sup>−1</sup>', 'dm<sup>6</sup> mol<sup>−2</sup> s<sup>−1</sup>'], answer: 'D', mark_scheme: 'D — k = rate ÷ [A]<sup>2</sup>[B] = mol dm<sup>−3</sup> s<sup>−1</sup> ÷ (mol dm<sup>−3</sup>)<sup>3</sup>.' },
    { id: 'm512', topic: '5.1.2', stem: 'What are the units of K<sub>c</sub> for the equilibrium below?<br>N<sub>2</sub>(g) + 3H<sub>2</sub>(g) <=> 2NH<sub>3</sub>(g)', options: ['mol dm<sup>−3</sup>', 'dm<sup>6</sup> mol<sup>−2</sup>', 'mol<sup>2</sup> dm<sup>−6</sup>', 'no units'], answer: 'B', mark_scheme: 'B — (mol dm<sup>−3</sup>)<sup>2</sup> ÷ (mol dm<sup>−3</sup>)<sup>4</sup> = dm<sup>6</sup> mol<sup>−2</sup>.' },
    { id: 'm513', topic: '5.1.3', stem: 'The titration curve for adding 0.100 mol dm<sup>−3</sup> NaOH(aq) to 25.0 cm<sup>3</sup> of an acid is shown. Which indicator is most suitable?', figure: { kind: 'graph', xLabel: 'Volume of NaOH(aq) added / cm<sup>3</sup>', yLabel: 'pH', xMin: 0, xMax: 50, yMin: 0, yMax: 14, series: [{ type: 'line', points: titrationCurve }] }, options: ['methyl orange (pH range 3.1–4.4)', 'methyl red (pH range 4.2–6.3)', 'bromothymol blue (pH range 6.0–7.6)', 'phenolphthalein (pH range 8.3–10.0)'], answer: 'D', mark_scheme: 'D — weak acid–strong base: the vertical section is roughly pH 7.5–11, so the indicator must change within it.' },
    { id: 'm513b', topic: '5.1.3', stem: 'What is the pH of 0.0100 mol dm<sup>−3</sup> NaOH(aq) at 25 °C? (K<sub>w</sub> = 1.00 × 10<sup>−14</sup> mol<sup>2</sup> dm<sup>−6</sup>)', options: ['2.00', '10.00', '12.00', '14.00'], answer: 'C', mark_scheme: 'C — [H<sup>+</sup>] = 1.00 × 10<sup>−14</sup> ÷ 0.0100 = 1.00 × 10<sup>−12</sup>; pH = 12.00.' },
    { id: 'm521', topic: '5.2.1', stem: 'Which compound has the most exothermic lattice enthalpy?', options: ['NaCl', 'KCl', 'MgO', 'CaO'], answer: 'C', mark_scheme: 'C — Mg<sup>2+</sup> and O<sup>2−</sup> have high charges and small radii, giving the strongest attraction.' },
    { id: 'm522', topic: '5.2.2', stem: 'For a reaction, ΔH = +50.0 kJ mol<sup>−1</sup> and ΔS = +200 J K<sup>−1</sup> mol<sup>−1</sup>. Above what temperature is the reaction feasible?', options: ['0.25 K', '250 K', '4000 K', 'It is feasible at all temperatures'], answer: 'B', mark_scheme: 'B — ΔG = 0 when T = ΔH ÷ ΔS = 50 000 ÷ 200 = 250 K.' },
    { id: 'm523', topic: '5.2.3', stem: 'The cell shown is set up under standard conditions.<br>Zn<sup>2+</sup>(aq) + 2e<sup>−</sup> <=> Zn(s)   E<sup>⦵</sup> = −0.76 V<br>Cu<sup>2+</sup>(aq) + 2e<sup>−</sup> <=> Cu(s)   E<sup>⦵</sup> = +0.34 V<br>What is the standard cell potential?', figure: { kind: 'cell', left: { electrode: 'Zn', solution: '1.00 mol dm<sup>−3</sup> Zn<sup>2+</sup>(aq)' }, right: { electrode: 'Cu', solution: '1.00 mol dm<sup>−3</sup> Cu<sup>2+</sup>(aq)' }, saltBridge: 'salt bridge' }, options: ['0.42 V', '1.10 V', '−1.10 V', '0.34 V'], answer: 'B', mark_scheme: 'B — E<sub>cell</sub> = (+0.34) − (−0.76) = 1.10 V.' },
    { id: 'm531', topic: '5.3.1', stem: 'What is the electron configuration of an Fe<sup>2+</sup> ion?', options: ['[Ar]3d<sup>6</sup>', '[Ar]3d<sup>4</sup>4s<sup>2</sup>', '[Ar]3d<sup>5</sup>4s<sup>1</sup>', '[Ar]3d<sup>6</sup>4s<sup>2</sup>'], answer: 'A', mark_scheme: 'A — 4s electrons are lost before 3d electrons.' },
    { id: 'm532', topic: '5.3.2', stem: 'Aqueous sodium hydroxide is added to a solution containing Fe<sup>3+</sup>(aq) ions. What is observed?', options: ['blue precipitate', 'green precipitate', 'orange-brown precipitate', 'white precipitate'], answer: 'C', mark_scheme: 'C — Fe(OH)<sub>3</sub>(s) is orange-brown.' },
    { id: 'm611', topic: '6.1.1', stem: 'What is the electrophile in the nitration of benzene?', options: ['NO<sub>2</sub><sup>−</sup>', 'NO<sub>2</sub><sup>+</sup>', 'NO<sub>3</sub><sup>−</sup>', 'HNO<sub>3</sub>'], answer: 'B', mark_scheme: 'B — the nitronium ion, formed from HNO<sub>3</sub> and H<sub>2</sub>SO<sub>4</sub>.' },
    { id: 'm612', topic: '6.1.2', stem: 'Which compound gives a silver mirror when warmed with Tollens’ reagent?', options: ['propanone', 'propanal', 'propan-2-ol', 'propanoic acid'], answer: 'B', mark_scheme: 'B — aldehydes are oxidised by Tollens’ reagent; ketones are not.' },
    { id: 'm613', topic: '6.1.3', stem: 'What is the name of the ester shown?', figure: { kind: 'structure', smiles: 'CCC(=O)OCC' }, options: ['propyl ethanoate', 'ethyl propanoate', 'ethyl butanoate', 'methyl propanoate'], answer: 'B', mark_scheme: 'B — made from propanoic acid and ethanol.' },
    { id: 'm621', topic: '6.2.1', stem: 'Which reagents convert nitrobenzene into phenylamine?', options: ['tin and concentrated HCl, then excess NaOH(aq)', 'NaBH<sub>4</sub> in water', 'concentrated H<sub>2</sub>SO<sub>4</sub> and HNO<sub>3</sub>', 'ammonia in ethanol, heated in a sealed tube'], answer: 'A', mark_scheme: 'A — reduction with Sn/conc. HCl; NaOH releases the free amine.' },
    { id: 'm622', topic: '6.2.2', stem: 'How many chiral centres are present in the molecule shown?', figure: { kind: 'structure', smiles: 'CC(O)C(N)C(=O)O' }, options: ['0', '1', '2', '3'], answer: 'C', mark_scheme: 'C — the carbon bonded to OH and the carbon bonded to NH<sub>2</sub> each have four different groups.' },
    { id: 'm623', topic: '6.2.3', stem: 'Hexane-1,6-diamine reacts with hexanedioic acid to form a polymer. Which row is correct?', options: ['addition polymer; no other product', 'polyester; H<sub>2</sub>O also formed', 'polyamide; H<sub>2</sub>O also formed', 'polyamide; NH<sub>3</sub> also formed'], answer: 'C', mark_scheme: 'C — condensation polymerisation forming amide links and eliminating water.' },
    { id: 'm624', topic: '6.2.4', stem: 'Which reagent converts bromoethane into propanenitrile?', options: ['HCN', 'KCN in ethanol', 'NH<sub>3</sub> in ethanol', 'NaOH(aq)'], answer: 'B', mark_scheme: 'B — nucleophilic substitution by CN<sup>−</sup> increases the chain length by one carbon.' },
    { id: 'm625', topic: '6.2.5', stem: 'Which reagent reduces butanone to butan-2-ol?', options: ['NaBH<sub>4</sub>', 'acidified K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>', 'Tollens’ reagent', 'concentrated H<sub>2</sub>SO<sub>4</sub>'], answer: 'A', mark_scheme: 'A — hydride ion acts as a nucleophile; ketone → secondary alcohol.' },
    { id: 'm631', topic: '6.3.1', stem: 'The thin-layer chromatogram of a mixture (M) and three known compounds (A, B and C) is shown. What is the R<sub>f</sub> value of compound A?', figure: { kind: 'tlc', solventFront: 6.0, labelSpots: true, lanes: [{ label: 'M', spots: [2.4, 5.4] }, { label: 'A', spots: [2.4] }, { label: 'B', spots: [5.4] }, { label: 'C', spots: [4.0] }] }, options: ['0.25', '0.40', '0.90', '2.5'], answer: 'B', mark_scheme: 'B — R<sub>f</sub> = 2.4 cm ÷ 6.0 cm = 0.40.' },
    { id: 'm632', topic: '6.3.2', stem: 'The <sup>1</sup>H NMR spectrum of a compound with molecular formula C<sub>4</sub>H<sub>8</sub>O is shown. Relative peak areas are given above each peak. Which compound is it?', figure: { kind: 'spectrum', spectrumType: 'h_nmr', tms: true, peaks: [{ x: 2.44, multiplicity: 'q', integration: '2', height: 55 }, { x: 2.13, multiplicity: 's', integration: '3', height: 85 }, { x: 1.06, multiplicity: 't', integration: '3', height: 80 }] }, options: ['butanal', 'butanone', 'but-3-en-2-ol', 'methylpropanal'], answer: 'B', mark_scheme: 'B — CH<sub>3</sub>CO singlet (3H) at 2.1; CH<sub>2</sub> quartet (2H) next to C=O; CH<sub>3</sub> triplet (3H). No aldehyde peak near 9.7.' }
  ],
  structured: [
    { id: 's1', stem: 'This question is about the elements in Period 3 of the Periodic Table. The melting points of the first four elements are plotted on the graph.',
      figure: { kind: 'graph', xLabel: 'Element', yLabel: 'Melting point / K', yMin: 0, yMax: 1800, categories: ['Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar'], series: [{ type: 'line', markers: true, points: [['Na', 371], ['Mg', 923], ['Al', 933], ['Si', 1687]] }] },
      parts: [
        { label: '(a)(i)', topic: '3.1.1', marks: 2, text: 'Using the graph, predict the order of melting points for P, S, Cl and Ar, from highest to lowest. Explain why sulfur has a higher melting point than phosphorus.', mark_scheme: 'S > P > Cl > Ar [1]\nS exists as S<sub>8</sub> molecules, P as P<sub>4</sub>; S<sub>8</sub> has more electrons so stronger London forces [1]' },
        { label: '(a)(ii)', topic: '2.2.2', marks: 3, text: 'Explain why silicon has a much higher melting point than aluminium.', mark_scheme: 'Silicon: giant covalent (lattice) structure [1]\nAluminium: giant metallic lattice [1]\nMany strong covalent bonds in Si require more energy to break than the metallic bonding in Al [1]' },
        { label: '(b)', topic: '3.1.1', marks: 3, text: 'Explain the trend in atomic radius across Period 3 from sodium to chlorine.', mark_scheme: 'Atomic radius decreases [1]\nNuclear charge / number of protons increases [1]\nElectrons added to the same shell, similar shielding, so outer electrons are pulled closer [1]' }
      ] },
    { id: 's2', stem: 'A student titrates 25.0 cm<sup>3</sup> of sodium hydroxide solution with 0.100 mol dm<sup>−3</sup> hydrochloric acid. The results are shown in the table.',
      figure: { kind: 'table', headers: ['', 'Rough', 'Trial 1', 'Trial 2', 'Trial 3'], rows: [['Final burette reading / cm<sup>3</sup>', '23.80', '23.65', '46.90', '23.20'], ['Initial burette reading / cm<sup>3</sup>', '0.00', '0.50', '23.65', '0.00'], ['Titre / cm<sup>3</sup>', '23.80', '23.15', '23.25', '23.20']] },
      parts: [
        { label: '(a)', topic: '1.1.3', marks: 1, text: 'Calculate the mean titre using the concordant results in the table.', mark_scheme: '(23.15 + 23.25 + 23.20) ÷ 3 = 23.20 cm<sup>3</sup> [1] (rough titre must be excluded)' },
        { label: '(b)', topic: '2.1.3', marks: 3, text: 'NaOH(aq) + HCl(aq) → NaCl(aq) + H<sub>2</sub>O(l)<br>Calculate the concentration, in mol dm<sup>−3</sup>, of the sodium hydroxide solution.', mark_scheme: 'n(HCl) = 0.100 × 23.20 ÷ 1000 = 2.32 × 10<sup>−3</sup> mol [1]\nn(NaOH) = 2.32 × 10<sup>−3</sup> mol (1 : 1 ratio) [1]\n[NaOH] = 2.32 × 10<sup>−3</sup> ÷ 0.0250 = 0.0928 mol dm<sup>−3</sup> [1]' },
        { label: '(c)', topic: '1.1.4', marks: 2, text: 'Each burette reading has an uncertainty of ±0.05 cm<sup>3</sup>. Calculate the percentage uncertainty in the mean titre and suggest one way to reduce it.', mark_scheme: '(2 × 0.05 ÷ 23.20) × 100 = 0.43% [1]\nUse a more concentrated NaOH sample / larger volume so the titre is larger (or more dilute HCl) [1]' },
        { label: '(d)', topic: '2.1.4', marks: 1, text: 'State the ionic equation for the neutralisation reaction.', mark_scheme: 'H<sup>+</sup>(aq) + OH<sup>−</sup>(aq) → H<sub>2</sub>O(l) [1]' }
      ] },
    { id: 's3', stem: 'This question is about enthalpy changes.',
      parts: [
        { label: '(a)', topic: '3.2.1', marks: 3, text: 'When 0.460 g of ethanol, C<sub>2</sub>H<sub>5</sub>OH, is burned, the temperature of 100.0 g of water rises by 20.0 K. Calculate the enthalpy change of combustion of ethanol in kJ mol<sup>−1</sup>. (c = 4.18 J g<sup>−1</sup> K<sup>−1</sup>)', mark_scheme: 'q = 100.0 × 4.18 × 20.0 = 8360 J [1]\nn(ethanol) = 0.460 ÷ 46.0 = 0.0100 mol [1]\nΔ<sub>c</sub>H = −8.36 ÷ 0.0100 = −836 kJ mol<sup>−1</sup> (sign required) [1]' },
        { label: '(b)', topic: '1.1.4', marks: 2, text: 'The data book value is −1367 kJ mol<sup>−1</sup>. Suggest two reasons why the experimental value is less exothermic.', mark_scheme: 'Any two: heat loss to surroundings [1]; incomplete combustion [1]; evaporation of ethanol from the wick [1]; non-standard conditions [1]' },
        { label: '(c)', topic: '3.2.1', marks: 3, text: 'Use the enthalpy changes of combustion below to calculate the enthalpy change of formation of methane.<br>Δ<sub>c</sub>H: C(s) = −394; H<sub>2</sub>(g) = −286; CH<sub>4</sub>(g) = −890 kJ mol<sup>−1</sup>', mark_scheme: 'Correct Hess cycle / Δ<sub>f</sub>H = ΣΔ<sub>c</sub>H(reactants) − ΣΔ<sub>c</sub>H(products) [1]\n= −394 + 2(−286) − (−890) [1]\n= −76 kJ mol<sup>−1</sup> [1]' }
      ] },
    { id: 's4', stem: 'The Boltzmann distribution of molecular energies for a gas-phase reaction is shown. E<sub>a</sub> is the activation energy without a catalyst and E<sub>c</sub> is the activation energy with a catalyst.',
      figure: { kind: 'graph', xLabel: 'Energy', yLabel: 'Number of molecules', hideXTicks: true, hideYTicks: true, yMin: 0, yMax: 50, series: [{ type: 'curve', points: mbCurve(1.0) }], vlines: [{ x: 3.2, label: 'E<sub>c</sub>' }, { x: 6.0, label: 'E<sub>a</sub>' }] },
      parts: [
        { label: '(a)', topic: '3.2.2', marks: 3, text: 'Use the diagram to explain how a catalyst increases the rate of reaction.', mark_scheme: 'Catalyst provides an alternative route with lower activation energy [1]\nMore molecules have energy ≥ E<sub>c</sub> than ≥ E<sub>a</sub> (greater area to right of E<sub>c</sub>) [1]\nMore frequent successful collisions [1]' },
        { label: '(b)', topic: '3.2.2', marks: 2, text: 'State and explain how the shape of the curve would change at a higher temperature.', mark_scheme: 'Peak lower and moves to the right (higher energy) [1]\nArea under curve unchanged as number of molecules is the same [1]' },
        { label: '(c)*', topic: '3.2.3', marks: 6, text: 'In the Haber process: N<sub>2</sub>(g) + 3H<sub>2</sub>(g) <=> 2NH<sub>3</sub>(g)  ΔH = −92 kJ mol<sup>−1</sup>.<br>Explain why a temperature of about 450 °C and a pressure of about 200 atm are used, in terms of rate, equilibrium yield and cost.', mark_scheme: 'Level 3 (5–6 marks): detailed explanation of both T and P with rate, yield and economic/safety compromise.\nLevel 2 (3–4 marks): explains effect of T or P on both yield and rate, with some compromise.\nLevel 1 (1–2 marks): simple statements about yield or rate.\nIndicative points: low T favours exothermic forward reaction (higher yield) but rate too slow; 450 °C compromise; high P shifts equilibrium right (4 → 2 mol gas) and increases rate; very high P is expensive and dangerous; iron catalyst increases rate.' }
      ] },
    { id: 's5', stem: 'Compound <b>X</b> has the molecular formula C<sub>3</sub>H<sub>6</sub>O. Its infrared and mass spectra are shown.',
      figure: { kind: 'spectrum', spectrumType: 'ir', caption: 'Infrared spectrum of X', peaks: [{ x: 2980, height: 22, width: 45 }, { x: 1715, height: 75, width: 26 }, { x: 1365, height: 35, width: 25 }, { x: 1220, height: 45, width: 30 }] },
      parts: [
        { label: '(a)', topic: '4.2.4', marks: 2, text: 'Identify the bond responsible for the strong absorption at about 1715 cm<sup>−1</sup>, and state what the absence of a broad absorption between 3200 and 3600 cm<sup>−1</sup> shows.', mark_scheme: 'C=O [1]\nNo O–H, so X is not an alcohol (or carboxylic acid) [1]' },
        { label: '(b)', topic: '4.2.4', marks: 2, text: 'The mass spectrum of X is shown below. State the m/z value of the molecular ion peak and identify the species responsible for the peak at m/z = 43.', figure: { kind: 'spectrum', spectrumType: 'ms', caption: 'Mass spectrum of X', peaks: [{ x: 15, height: 25 }, { x: 42, height: 8, label: false }, { x: 43, height: 100 }, { x: 58, height: 32 }] }, mark_scheme: 'm/z = 58 [1]\nCH<sub>3</sub>CO<sup>+</sup> [1] (positive charge required)' },

/* ============================================================
   5. PAPER BUILDING (bank or AI) and pagination
   ============================================================ */
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function paperConfig(state) {
  const base = PRESET_CONFIGS[state.preset];
  if (state.preset !== 'custom') return { ...base };
  const marks = state.customMarks;
  const mcq = state.customMcq ? Math.round(marks * 0.15) : 0;
  return { ...base, marks, mcq, time: formatTime(Math.round(marks * 1.35 / 5) * 5) };
}

function buildPaperFromBank(cfg, topics) {
  const sel = new Set(topics);
  const mcqPool = shuffle(QUESTION_BANK.mcq.filter(q => sel.has(q.topic)));
  // Spread MCQs across topics before doubling up.
  const byTopic = {}; mcqPool.forEach(q => { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
  const mcqs = [];
  while (mcqs.length < cfg.mcq && Object.values(byTopic).some(l => l.length)) {
    shuffle(Object.keys(byTopic)).forEach(t => { if (mcqs.length < cfg.mcq && byTopic[t].length) mcqs.push(byTopic[t].shift()); });
  }
  mcqs.sort((a, b) => a.topic.localeCompare(b.topic));
  const target = cfg.marks - mcqs.length;
  const structured = [];
  let total = 0;
  shuffle(QUESTION_BANK.structured).forEach(q => {
    if (total >= target) return;
    const parts = q.parts.filter(p => sel.has(p.topic));
    if (!parts.length) return;
    const marks = parts.reduce((a, p) => a + p.marks, 0);
    if (total + marks > target) return;
    structured.push({ ...q, parts });
    total += marks;
  });
  structured.sort((a, b) => a.parts[0].topic.localeCompare(b.parts[0].topic));
  return normalisePaper(cfg, topics, mcqs, structured, 'bank');
}

function relabelParts(parts) {
  // If some parts were filtered out, re-letter them (a), (b)... keeping roman sub-parts.
  let letterIdx = -1, lastLetter = null;
  return parts.map(p => {
    const m = String(p.label || '').match(/^\(([a-z])\)(\(([ivx]+)\))?(\*)?$/i);
    if (!m) return p;
    if (m[1] !== lastLetter) { letterIdx++; lastLetter = m[1]; }
    const L = String.fromCharCode(97 + letterIdx);
    return { ...p, label: `(${L})${m[2] || ''}${m[4] || ''}` };
  });
}

function normalisePaper(cfg, topics, mcqs, structured, source) {
  let n = 0;
  const mcqOut = mcqs.map((q, i) => {
    n++;
    const letters = ['A', 'B', 'C', 'D'];
    const options = (q.options || []).slice(0, 4).map((o, j) => (typeof o === 'string' ? { letter: letters[j], text: o } : { letter: (o.letter || letters[j]).toUpperCase().slice(0, 1), text: o.text || '', smiles: o.smiles || '' }));
    const answer = String(q.answer || '').trim().toUpperCase().charAt(0);
    return { id: `mcq_${i}`, ref: q.ref || String(n), type: 'mcq', topic: q.topic, marks: 1, stem: q.stem || q.text || '', figure: q.figure || null, options, answer, mark_scheme: q.mark_scheme || `${answer}`, db: q.db || null, msImage: q.msImage || null, sourceTag: q.sourceTag || '' };
  });
  const sOut = structured.map((q, i) => {
    n++;
    const mapped = (q.parts || []).map(p => ({ label: p.label || '', topic: p.topic || q.topic, marks: Math.max(1, parseInt(p.marks, 10) || 1), text: p.text || '', figure: p.figure || null, mark_scheme: p.mark_scheme || '', db: p.db || null, msImage: p.msImage || null, selfMark: !!p.selfMark }));
    const parts = q.keepLabels ? mapped : relabelParts(mapped);
    return { id: `sq_${i}`, ref: q.ref || String(n), type: 'structured', topic: q.topic || (parts[0] && parts[0].topic), stem: q.stem || '', figure: q.figure || null, parts, marks: parts.reduce((a, p) => a + p.marks, 0), sourceTag: q.sourceTag || '' };
  });
  const total = mcqOut.length + sOut.reduce((a, q) => a + q.marks, 0);
  return { cfg, topics, mcqs: mcqOut, structured: sOut, total, source };
}

// Questions flow onto A4 pages using their measured rendered heights (px).
function buildBlocks(paper) {
  const blocks = [];
  if (paper.mcqs.length) {
    blocks.push({ kind: 'section', title: 'SECTION A — Multiple Choice Questions' });
    paper.mcqs.forEach(q => blocks.push({ kind: 'mcq', q }));
  }
  if (paper.structured.length) {
    blocks.push({ kind: 'section', title: paper.mcqs.length ? 'SECTION B — Structured Questions' : 'Answer ALL the questions' });
    paper.structured.forEach(q => {
      blocks.push({ kind: 'stem', q });
      q.parts.forEach((p, i) => blocks.push({ kind: 'part', q, p, i }));
    });
  }
  return blocks;
}
function msItems(paper) {
  const ms = [];
  paper.mcqs.forEach(q => ms.push({ ref: q.ref, marks: 1, text: plain(q.stem), scheme: q.mark_scheme && !q.mark_scheme.startsWith(q.answer) ? `${q.answer} — ${q.mark_scheme}` : (q.mark_scheme || q.answer), msImage: q.msImage }));
  paper.structured.forEach(q => q.parts.forEach(p => ms.push({ ref: `${q.ref}${p.label}`, marks: p.marks, text: plain(p.text), scheme: p.mark_scheme, msImage: p.msImage })));
  return ms;
}
function packPages(items, height, firstCap, cap, keepWithNext, startExtra) {
  const pages = [];
  let cur = [], used = 0, limit = firstCap;
  items.forEach((it, i) => {
    const h = height(it, i);
    const next = items[i + 1];
    const need = h + (keepWithNext && keepWithNext(it) && next ? height(next, i + 1) : 0);
    if (cur.length && used + need > limit) { pages.push(cur); cur = []; used = 0; limit = cap; }
    if (!cur.length && startExtra) used += startExtra(it);
    cur.push(it); used += h;
  });
  if (cur.length) pages.push(cur);
  return pages;
}
function paginate(paper, m) {
  const blocks = buildBlocks(paper);
  const qPages = packPages(blocks, m.block, m.firstCap, m.cap, b => b.kind === 'section' || b.kind === 'stem', b => (b.kind === 'part' ? m.continued : 0))
    .map((items, i) => ({ pageNum: i + 1, isMarkSchemePage: false, items }));
  const msPages = packPages(msItems(paper), m.msItem, m.msFirstCap, m.msCap)
    .map((chunk, i) => ({ pageNum: qPages.length + i + 1, isMarkSchemePage: true, msChunk: chunk }));
  return { pages: qPages.concat(msPages), questionPages: qPages.length };
}

async function aiRequest(conn, method, url, headers, body) {
  const P = AI_PROVIDERS[conn.provider];
  let res;
  try {
    res = await fetch(url, { method, headers: { ...(body ? { 'content-type': 'application/json' } : {}), ...headers }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error(`Could not reach the ${P.name} API. Check your internet connection.`); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) {
    const err = data && (data.error || (Array.isArray(data) && data[0] && data[0].error));
    const msg = err && err.message ? err.message : `HTTP ${res.status}`;
    if (res.status === 401 || res.status === 403 || /api key not valid|invalid api key|incorrect api key|invalid x-api-key/i.test(msg)) throw new Error(`Your ${P.name} API key was rejected. Check it in AI settings.`);
    if (res.status === 404) throw new Error(`${P.name} does not recognise the model “${conn.model}”. Choose another model in AI settings.`);
    if (res.status === 429) throw new Error(`${P.name} rate limit or quota reached: ${msg}`);
    if ([500, 502, 503, 529].includes(res.status)) throw new Error(`${P.name} is overloaded right now. Try again in a minute.`);

  }

}
const anthropicHeaders = (key) => ({ 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' });
const openaiHeaders = (key) => ({ authorization: `Bearer ${key}` });
const geminiHeaders = (key) => ({ 'x-goog-api-key': key });
const geminiUrl = (model, action) => `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}${action}`;

// Check a key and model without generating anything.
async function aiPing(conn) {
  if (conn.provider === 'claude') return aiRequest(conn, 'GET', `https://api.anthropic.com/v1/models/${encodeURIComponent(conn.model)}`, anthropicHeaders(conn.key));
  if (conn.provider === 'openai') return aiRequest(conn, 'GET', `https://api.openai.com/v1/models/${encodeURIComponent(conn.model)}`, openaiHeaders(conn.key));

const outOfSpace = (P) => new Error(`${P.name} ran out of space while writing. Try a shorter paper or a different model.`);
function openaiText(P, data) {
  if (data.status === 'incomplete') { if (data.incomplete_details && /max_output_tokens/.test(data.incomplete_details.reason || '')) throw outOfSpace(P); }
  const txt = (data.output || []).filter(o => o.type === 'message').flatMap(o => o.content || []).filter(c => c.type === 'output_text').map(c => c.text).join('');
  const refusal = (data.output || []).flatMap(o => o.content || []).find(c => c.type === 'refusal');
  if (!txt && refusal) throw new Error(`${P.name} declined: ${refusal.refusal}`);
  return txt;
}
function geminiText(P, data) {
  if (data.promptFeedback && data.promptFeedback.blockReason) throw new Error(`${P.name} blocked the request (${data.promptFeedback.blockReason}).`);
  const c = (data.candidates || [])[0];
  if (!c) throw new Error(`${P.name} returned no answer.`);
  const txt = ((c.content && c.content.parts) || []).filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
  if (!txt && c.finishReason === 'MAX_TOKENS') throw outOfSpace(P);
  if (!txt && c.finishReason && c.finishReason !== 'STOP') throw new Error(`${P.name} stopped early (${c.finishReason}).`);
  return txt;
}
function parseJSONText(P, t) {
  let s = String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(s); } catch (e) { /* fall through */ }
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { /* fall through */ } }
  throw new Error(`${P.name} did not return its answer in the expected format. Please try again.`);
}
const jsonInstruction = (schema) => `\n\nReply with ONLY one JSON object, with no other text and no code fences, matching this JSON Schema:\n${JSON.stringify(schema)}`;

// Structured answer: returns the parsed object.
async function aiJSON(conn, { system, prompt, schema, name, maxTokens }) {
  const P = AI_PROVIDERS[conn.provider];
  if (conn.provider === 'claude') {
    const data = await aiRequest(conn, 'POST', 'https://api.anthropic.com/v1/messages', anthropicHeaders(conn.key), { model: conn.model, max_tokens: maxTokens, system, tools: [{ name, description: 'Submit your answer.', input_schema: schema }], tool_choice: { type: 'tool', name }, messages: [{ role: 'user', content: prompt }] });
    const block = (data.content || []).find(b => b.type === 'tool_use' && b.name === name);
    if (!block) { if (data.stop_reason === 'max_tokens') throw outOfSpace(P); throw new Error(`${P.name} did not return its answer in the expected format. Please try again.`); }
    return block.input;
  }
  if (conn.provider === 'openai') {
    const body = { model: conn.model, instructions: system + jsonInstruction(schema), input: prompt, max_output_tokens: maxTokens + 8000, text: { format: { type: 'json_schema', name, schema, strict: false } } };
    let data;
    try { data = await aiRequest(conn, 'POST', 'https://api.openai.com/v1/responses', openaiHeaders(conn.key), body); }
    catch (e) {
      if (e.status !== 400) throw e;
      data = await aiRequest(conn, 'POST', 'https://api.openai.com/v1/responses', openaiHeaders(conn.key), { ...body, text: { format: { type: 'json_object' } } });
    }
    return parseJSONText(P, openaiText(P, data));
  }
  const data = await aiRequest(conn, 'POST', geminiUrl(conn.model, ':generateContent'), geminiHeaders(conn.key), { systemInstruction: { parts: [{ text: system + jsonInstruction(schema) }] }, contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', maxOutputTokens: maxTokens + 8000 } });
  return parseJSONText(P, geminiText(P, data));
}
// Free-text answer.
async function aiText(conn, { system, prompt, maxTokens }) {
  const P = AI_PROVIDERS[conn.provider];
  if (conn.provider === 'claude') {
    const data = await aiRequest(conn, 'POST', 'https://api.anthropic.com/v1/messages', anthropicHeaders(conn.key), { model: conn.model, max_tokens: maxTokens, system, messages: [{ role: 'user', content: prompt }] });
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  }
  if (conn.provider === 'openai') {
    const data = await aiRequest(conn, 'POST', 'https://api.openai.com/v1/responses', openaiHeaders(conn.key), { model: conn.model, instructions: system, input: prompt, max_output_tokens: maxTokens + 8000 });
    return openaiText(P, data).trim();
  }
  const data = await aiRequest(conn, 'POST', geminiUrl(conn.model, ':generateContent'), geminiHeaders(conn.key), { systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: maxTokens + 8000 } });
  return geminiText(P, data).trim();
}

const GEN_SYSTEM = `You are a senior examiner writing ORIGINAL practice questions for OCR A Level Chemistry A (H432). Match OCR style: command words (State, Explain, Calculate, Deduce, Suggest, Describe), British spelling, SI units, data in the stem, and mark allocations in proportion to the work required.

- Use <sub> and <sup> tags for formulae, charges and units (e.g. CH<sub>3</sub>COO<sup>−</sup>, mol dm<sup>−3</sup>). Use <=> for equilibrium arrows. No other HTML.

- Use figures generously, as real papers do: spectra for analysis questions, skeletal structures for organic questions, graphs for rates/titrations/Boltzmann/periodicity, tables for experimental data.
- Only use the topic ids you are given.`;

async function generateWithAI(cfg, topics, conn, progress) {
  const P = AI_PROVIDERS[conn.provider];
  const topicList = (ids) => ids.map(t => `${t} ${plain(TOPIC_INDEX[t].name)}`).join('\n');
  const jobs = [];
  if (cfg.mcq > 0) {
    jobs.push({ label: `Section A: ${cfg.mcq} multiple-choice questions`, prompt: `Paper: ${cfg.title} (${cfg.code}).\nWrite exactly ${cfg.mcq} multiple-choice questions (1 mark each, four options A–D, one correct) spread across these topics:\n${topicList(topics)}\nAt least a third of the questions should include a figure (graph, spectrum, structure, table, energy profile, cell or chromatogram). Vary the position of the correct letter.`, maxTokens: 12000 });
  }
  let remaining = cfg.marks - cfg.mcq;
  const shuffled = shuffle(topics);
  const chunks = Math.max(1, Math.ceil(remaining / 30));
  for (let c = 0; c < chunks; c++) {
    const marks = c === chunks - 1 ? remaining : Math.round((cfg.marks - cfg.mcq) / chunks);
    remaining -= marks;
    const ts = shuffled.filter((_, i) => i % chunks === c);
    const use = ts.length ? ts : shuffled;
    jobs.push({ label: `Structured questions, part ${c + 1} of ${chunks} (${marks} marks)`, prompt: `Paper: ${cfg.title} (${cfg.code}).\nWrite structured questions totalling exactly ${marks} marks (sum of part marks). Each question should be 8–16 marks with 2–5 parts that build on a shared context. Cover these topics:\n${topicList(use)}\n${marks >= 20 ? 'Include one 6-mark level-of-response part, labelled with * (e.g. (c)*).' : ''}\nAt least half of the questions should include a figure.`, maxTokens: 16000 });
  }
  progress(jobs.map(j => ({ label: j.label, status: 'running' })));
  const results = await Promise.all(jobs.map(async (job, i) => {
    try {
      const out = await aiJSON(conn, { system: GEN_SYSTEM, prompt: job.prompt, schema: QUESTIONS_TOOL.input_schema, name: 'submit_questions', maxTokens: job.maxTokens });
      progress(null, i, 'done');
      return Array.isArray(out.questions) ? out.questions : [];
    } catch (e) { progress(null, i, 'err'); throw e; }
  }));
  const all = results.flat().filter(q => q && typeof q === 'object');
  const allowed = new Set(topics);
  const fixTopic = (t) => (allowed.has(t) ? t : topics[0]);
  const mcqs = all.filter(q => q.type === 'mcq' && Array.isArray(q.options) && q.options.length >= 4 && q.answer).map(q => ({ ...q, topic: fixTopic(q.topic) })).slice(0, cfg.mcq);
  const structured = all.filter(q => q.type === 'structured' && Array.isArray(q.parts) && q.parts.length).map(q => ({ ...q, topic: fixTopic(q.topic), parts: q.parts.filter(p => p && p.text).map(p => ({ ...p, topic: fixTopic(p.topic || q.topic) })) })).filter(q => q.parts.length);
  if (!mcqs.length && !structured.length) throw new Error(`${P.name} did not return any usable questions. Please try again.`);
  const paper = normalisePaper(cfg, topics, mcqs, structured, 'ai');
  paper.aiName = P.name;
  await repairFigures(paper, conn, progress);
  return paper;
}

// Find questions that mention a figure but have none (or one that cannot be drawn) and ask the AI to supply it.
function figureGaps(paper) {
  const gaps = [];
  paper.mcqs.forEach(q => {
    const prob = q.figure ? figureProblem(q.figure) : (FIGURE_REF_RE.test(plain(q.stem)) ? 'missing' : null);
    if (prob) gaps.push({ id: q.id, text: plain(q.stem), options: q.options.map(o => `${o.letter}: ${plain(o.text)}`).join(' | '), problem: prob, set: (f) => { q.figure = f; } });
  });
  paper.structured.forEach(q => {
    const stemProb = q.figure ? figureProblem(q.figure) : (FIGURE_REF_RE.test(plain(q.stem)) ? 'missing' : null);
    if (stemProb) gaps.push({ id: q.id, text: plain(q.stem), problem: stemProb, set: (f) => { q.figure = f; } });
    q.parts.forEach((p, j) => {
      const prob = p.figure ? figureProblem(p.figure) : (FIGURE_REF_RE.test(plain(p.text)) && !q.figure && !stemProb ? 'missing' : null);
      if (prob) gaps.push({ id: `${q.id}_p${j}`, text: `${plain(q.stem)} ${p.label} ${plain(p.text)}`, scheme: plain(p.mark_scheme), problem: prob, set: (f) => { p.figure = f; } });
    });
  });
  return gaps;
}
const FIGURES_SCHEMA = { type: 'object', properties: { figures: { type: 'array', items: { type: 'object', properties: { id: { type: 'string' }, figure: FIGURE_SCHEMA }, required: ['id', 'figure'] } } }, required: ['figures'] };
async function repairFigures(paper, conn, progress) {
  const gaps = figureGaps(paper);
  if (!gaps.length) return;
  progress(null, null, null, { label: `Drawing ${gaps.length} missing figure${gaps.length > 1 ? 's' : ''}`, status: 'running' });
  const list = gaps.map(g => `id: ${g.id}\nproblem: ${g.problem === 'missing' ? 'the text refers to a figure but none was supplied' : `the figure could not be drawn (${g.problem})`}\nquestion: ${g.text}${g.options ? `\noptions: ${g.options}` : ''}${g.scheme ? `\nmark scheme: ${g.scheme}` : ''}`).join('\n\n');
  try {
    const out = await aiJSON(conn, { system: GEN_SYSTEM, prompt: `Supply the figure for each question below so that it matches the question and mark scheme.\n\n${list}`, schema: FIGURES_SCHEMA, name: 'submit_figures', maxTokens: 8000 });
    (out.figures || []).forEach(f => { const g = gaps.find(x => x.id === f.id); if (g && f.figure && !figureProblem(f.figure)) g.set(f.figure); });
    progress(null, null, 'done-extra');
  } catch (e) { progress(null, null, 'err-extra'); /* keep the paper; renderer shows a notice for anything missing */ }
}

// Render the AI's lightly-structured text (## headings, - bullets) safely.
function fmtNotes(text) {
  const lines = String(text || '').split('\n');
  let html = '', inList = false;
  lines.forEach(raw => {
    const line = raw.trim();
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    if (!line) { closeList(); return; }
    if (/^#{1,3}\s+/.test(line)) { closeList(); html += `<h4 class="rev-h">${fmt(line.replace(/^#{1,3}\s+/, '').replace(/\*\*/g, ''))}</h4>`; return; }
    if (/^[-•*]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${fmt(line.replace(/^[-•*]\s+/, '').replace(/\*\*/g, ''))}</li>`; return; }
    closeList(); html += `<p>${fmt(line.replace(/\*\*/g, ''))}</p>`;
  });
  if (inList) html += '</ul>';
  return html;
}

// Offline fallback: keyword overlap with the mark scheme.
function keywordMark(userText, schemeText, maxMarks) {
  if (!userText || !userText.trim()) return { awarded: 0, feedback: 'No answer provided.' };
  const stop = new Set(['with', 'that', 'this', 'from', 'more', 'than', 'have', 'each', 'allow', 'mark', 'marks', 'level', 'required', 'which', 'their', 'there', 'when']);
  const words = [...new Set(plain(schemeText).replace(/[^a-zA-Z0-9\s]/g, ' ').toLowerCase().split(/\s+/).filter(w => w.length > 3 && !stop.has(w)))];
  if (!words.length) return { awarded: 0, feedback: 'Could not auto-mark; compare with the mark scheme and set the mark yourself.' };
  const u = userText.toLowerCase();
  const ratio = words.filter(w => u.includes(w)).length / words.length;
  const awarded = Math.min(maxMarks, Math.round(maxMarks * Math.min(1, ratio / 0.6)));
  return { awarded, feedback: `Keyword estimate (${awarded}/${maxMarks}). Add an AI API key for examiner-style marking, or check the mark scheme and override.` };
}

function waitFor(test, ms) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function poll() { if (test()) return resolve(); if (Date.now() - t0 > ms) return reject(new Error('timed out')); setTimeout(poll, 100); })();
  });
}
async function getSupabase() {

  await waitFor(() => window.supabase && window.supabase.createClient, 20000).catch(() => { throw new Error('The Supabase library did not load. Check your internet connection.'); });
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'ocrchem.auth' } });
  return sbClient;
}
async function fetchAll(sb, table, columns, orderCols) {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(table).select(columns);
    orderCols.forEach(c => { q = q.order(c, { ascending: true }); });
    const { data, error } = await q.range(from, from + 999);
    if (error) throw new Error(`Could not load ${table}: ${error.message}`);
    rows.push(...data);
    if (data.length < 1000) break;
  }
  return rows;
}
const codeCmp = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };
const qNumOf = (ref) => ((String(ref).match(/^Q(\d+)/) || [])[1] || '');
const refSuffix = (ref) => String(ref).replace(/^Q\d+/, '');
const mcqLetter = (ms) => ((String(ms || '').match(/^\s*([A-D])\b/) || [])[1] || '');

const imageFig = (path, alt) => (path ? { kind: 'image', path, alt } : null);
// Split shared opening paragraphs (the question's context) from each part's own text.
function splitShared(texts) {
  if (texts.length < 2) return { shared: '', rest: texts };
  const paras = texts.map(t => String(t).split(/\n{2,}/));
  let k = 0;
  while (paras.every(p => p.length > k + 1 && p[k].trim() === paras[0][k].trim())) k++;
  return { shared: paras[0].slice(0, k).join('\n\n'), rest: paras.map(p => p.slice(k).join('\n\n')) };
}
function groupDbQuestions(qs) {
  const groups = [], index = {};
  qs.slice().sort((a, b) => a.id - b.id).forEach(q => {
    const key = `${q.paper_id}|${qNumOf(q.question_ref)}`;
    if (!index[key]) { index[key] = { key, paperId: q.paper_id, num: qNumOf(q.question_ref), items: [] }; groups.push(index[key]); }
    index[key].items.push(q);
  });
  return groups;
}
function dbMcq(q, keepRef) {
  const p = DB.papersById[q.paper_id];
  return { topic: q.ocrTopic, ref: keepRef ? qNumOf(q.question_ref) : undefined, stem: q.question_text, figure: imageFig(q.image_path, `Figure for ${paperLabel(p)} ${q.question_ref}`), options: ['A', 'B', 'C', 'D'].map(l => ({ letter: l, text: '' })), answer: mcqLetter(q.mark_scheme), mark_scheme: q.mark_scheme, msImage: imageFig(q.mark_scheme_image_path, 'Mark scheme image'), db: q, sourceTag: `${paperLabel(p)} ${q.question_ref}` };
}
function dbStructured(group, keepRef) {
  const p = DB.papersById[group.paperId];
  const { shared, rest } = splitShared(group.items.map(q => q.question_text));
  const seen = new Set();
  const parts = group.items.map((q, i) => {
    let figure = null;
    if (q.image_path && !seen.has(q.image_path)) { seen.add(q.image_path); figure = imageFig(q.image_path, `Figure for ${paperLabel(p)} ${q.question_ref}`); }
    return { label: refSuffix(q.question_ref), topic: q.ocrTopic, marks: q.marks, text: rest[i] || q.question_text, figure, mark_scheme: q.mark_scheme || '', msImage: imageFig(q.mark_scheme_image_path, 'Mark scheme image'), selfMark: q.delivery_mode === 'download_only', db: q };
  });
  return { topic: parts[0].topic, ref: keepRef ? group.num : undefined, stem: shared, parts, keepLabels: true, sourceTag: `${paperLabel(p)} Q${group.num}` };
}

// A paper of past-paper questions on the chosen topics.
function buildPaperFromDb(cfg, topics, includeDrawing) {
  const sel = new Set(topics);
  const eligible = DB.questions.filter(q => sel.has(q.ocrTopic) && (includeDrawing || q.delivery_mode !== 'download_only'));
  const byTopic = {};
  shuffle(eligible.filter(isDbMcq)).forEach(q => { (byTopic[q.ocrTopic] = byTopic[q.ocrTopic] || []).push(q); });
  const mcqs = [];
  while (mcqs.length < cfg.mcq && Object.values(byTopic).some(l => l.length)) {
    shuffle(Object.keys(byTopic)).forEach(t => { if (mcqs.length < cfg.mcq && byTopic[t].length) mcqs.push(byTopic[t].shift()); });
  }
  mcqs.sort((a, b) => codeCmp(a.ocrTopic, b.ocrTopic) || a.id - b.id);
  const target = cfg.marks - mcqs.length;
  const chosen = [];
  let total = 0;
  shuffle(groupDbQuestions(eligible.filter(q => !isDbMcq(q)))).forEach(g => {
    const marks = g.items.reduce((a, q) => a + q.marks, 0);
    if (total + marks > target) return;
    chosen.push(g); total += marks;
  });
  chosen.sort((a, b) => codeCmp(a.items[0].ocrTopic, b.items[0].ocrTopic) || a.items[0].id - b.items[0].id);
  const paper = normalisePaper(cfg, topics, mcqs.map(q => dbMcq(q, false)), chosen.map(g => dbStructured(g, false)), 'db');
  paper.available = { questions: eligible.length, marks: eligible.reduce((a, q) => a + q.marks, 0) };
  return paper;
}
// A complete past paper, in its original order and numbering.
function buildFullPastPaper(paperId) {
  const p = DB.papersById[paperId];
  const qs = (DB.byPaper[paperId] || []).slice().sort((a, b) => a.id - b.id);
  const title = String(p.paper_title || '').replace(/^H432\/0\d\s*/, '');
  const cfg = { title: `${paperLabel(p)}: ${title}`, short: title, code: `H432/0${p.paper_number}`, marks: qs.reduce((a, q) => a + q.marks, 0), mcq: qs.filter(isDbMcq).length, time: timeForPaper(p.paper_number), modules: (PRESET_CONFIGS[`paper${p.paper_number}`] || {}).modules || [] };
  const topics = [...new Set(qs.map(q => q.ocrTopic).filter(Boolean))].sort(codeCmp);
  const paper = normalisePaper(cfg, topics, qs.filter(isDbMcq).map(q => dbMcq(q, true)), groupDbQuestions(qs.filter(q => !isDbMcq(q))).map(g => dbStructured(g, true)), 'db');
  paper.pastPaper = paperLabel(p);
  return paper;
}
// Sign every image in the paper and preload it, so page layout knows its size.
async function prepareImages(paper) {
  const figs = [];
  const add = (f) => { if (f && f.kind === 'image' && f.path) figs.push(f); };
  paper.mcqs.forEach(q => { add(q.figure); add(q.msImage); });
  paper.structured.forEach(q => { add(q.figure); q.parts.forEach(p => { add(p.figure); add(p.msImage); }); });
  if (!figs.length) return;
  const paths = [...new Set(figs.map(f => f.path))];
  const urls = {};
  try {
    const sb = await getSupabase();
    for (let i = 0; i < paths.length; i += 100) {
      const { data, error } = await sb.storage.from(IMAGE_BUCKET).createSignedUrls(paths.slice(i, i + 100), 6 * 3600);
      if (error) throw error;
      (data || []).forEach(d => { if (d.signedUrl) urls[d.path] = d.signedUrl; });
    }
  } catch (e) { /* images fall back to a notice */ }
  const sizes = {};
  await Promise.all(Object.entries(urls).map(([path, url]) => new Promise(resolve => {
    const img = new Image();
    const done = (ok) => { sizes[path] = ok ? { w: img.naturalWidth, h: img.naturalHeight } : null; resolve(); };
    const t = setTimeout(() => done(false), 20000);
    img.onload = () => { clearTimeout(t); done(true); };
    img.onerror = () => { clearTimeout(t); done(false); };
    img.src = url;
  })));
  figs.forEach(f => { f.src = urls[f.path] || ''; const sz = sizes[f.path]; if (sz) { f.w = sz.w; f.h = sz.h; } else f.failed = true; });
}
